name = "livehuddle-help"
# The liveworkspace Cloudflare account, which also hosts livehuddle.app, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
compatibility_date = "2026-05-29"
# No public *.workers.dev address or preview URLs: a copy there would skip the zone's WAF and
# rate-limit rules. The Worker is reached only at its custom domain or over a service binding
# (docs/specs/016-platform/deployment.md "Custom domain").
workers_dev = false
preview_urls = false

# Static assets only — Cloudflare Workers serves files from `./out`
# (Next.js static export output). No worker code needed; the router
# worker forwards `/help/*` here after stripping the prefix (see
# apps/router + docs/specs/018-help/help-app.md). Same pattern as the telemetry app.
[assets]
directory = "./out"
not_found_handling = "404-page"

# Staging (docs/specs/016-platform/staging-environment.md): `wrangler deploy --env staging` deploys the same
# static `./out` as `livehuddle-help-staging`. The build that fills
# `out/` is a different one — staging bakes its own NEXT_PUBLIC_* values —
# so the two environments never share an artifact.
#
# `[assets]` is an inheritable key, restated here so this block reads as the
# complete description of the staging worker rather than a diff against the
# one above.
# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livehuddle-help-staging"
workers_dev = false
preview_urls = false

[env.staging.assets]
directory = "./out"
not_found_handling = "404-page"
