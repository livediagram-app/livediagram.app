name = "livehuddle-api"
# The liveworkspace Cloudflare account, which also hosts livehuddle.app, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Local dev port, off wrangler's 8787 default, which the liveworkspace accounts Worker holds, so
# livehuddle's stack runs beside it (the router's API_ORIGIN and the docs name the same port).
[dev]
port = 9087

# Plain (non-secret) vars. Everything here is every fork's default too, so
# what only livehuddle.app runs with is NOT here: TELEMETRY_ENABLED and the
# image gallery caps live in `hosted-vars.json`, which the deploy workflow adds
# with `wrangler deploy --var` on livehuddle.app's own repository only, and
# then verifies on the editor worker (docs/specs/016-platform/deployment.md
# "Hosted profile"). A fork is therefore telemetry-off and uncapped until it
# opts in, by declaring the var here. TELEMETRY_ENABLED gates the anonymous,
# first-party product analytics this worker sends to the liveworkspace
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/specs/008-telemetry/telemetry.md):
# "true" turns it on; anything else, or absent, keeps it fully off. TELEMETRY_URL
# names that service per environment (hosted-vars.json); unset means
# production's, https://www.liveworkspace.app/api/telemetry. Local dev sets
# TELEMETRY_URL=http://localhost:8790/api/telemetry in .dev.vars.
[vars]
# The sender for this app's email (see EMAIL below). livehuddle.app is onboarded to Email Service on this account.
EMAIL_FROM = "livehuddle <hello@livehuddle.app>"

# The calls kill switch's budget poll (docs/specs/016-platform/calls-kill-switch.md). Settings, not code: the monthly
# Realtime cost above the free 1,000 GB that trips calls to audio only, then off (the owner's $10 and $25), and the
# account whose usage is priced. CALLS_ANALYTICS_TOKEN (Account Analytics: Read) and CALLS_ALERT_TO (where a trip's
# email goes) are secrets; without the token, or without the CALLS_SWITCH namespace below, the poll does nothing.
CALLS_AUDIO_ONLY_AT_USD = "10"
CALLS_OFF_AT_USD = "25"
CALLS_USAGE_ACCOUNT_ID = "851be7d244b76a6557bcbe6c4ded80f5"

# No bucket: images are liveworkspace's media service's (MEDIA_KEY below), and snapshots and share cards
# its previews (liveworkspace/docs/specs/006-media/previews.md). The bytes uploaded before that move are still in the previous
# Cloudflare account's livehuddle-images bucket, until they are migrated into the media service.

# Per-owner rate limiter (Cloudflare Workers Rate Limiting API).
# Caps writes at 300 / 60s per owner: a generous ceiling for normal
# editing (autosave + comment posts + log appends) but well below
# what a malicious bot would push through. The api worker calls
# `env.WRITE_RATE_LIMITER.limit({ key })` at the top of every write
# endpoint; over-limit requests get a 429. Namespace ids are
# arbitrary local identifiers (Cloudflare scopes by binding name +
# script). When this binding is absent the rate-limit
# helper falls through to "allow" so deployments without the
# feature still work.
[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Per-IP limiter for the anonymous telemetry relay (POST /api/events,
# docs/specs/017-telemetry/telemetry.md "The relay"), which passes a script's counts on to the
# liveworkspace service. Separate namespace from the write limiter so abuse of the
# public events endpoint can never eat into a user's document-write
# budget. 120 batches / 60s per IP is generous for a script (one event per
# command) while bounding how fast one source can inflate the public dashboard.
# Keyed on CF-Connecting-IP in src/index.ts. Absent binding → the
# helper allows, so a deployment still works.
[[unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The document's Durable Object (docs/specs/015-api/api.md "Storage"): one SQLite-backed instance per document
# id, holding the document's content (tabs, the slide deck, changesets, image references) in its own SQLite and
# running its realtime room (presence + ordered ops over hibernating WebSockets).
[[durable_objects.bindings]]
name = "DOCUMENT_ROOM"
class_name = "DocumentRoom"

# Each person's Durable Object (src/person-store/person-store.ts): one SQLite-backed instance per person id,
# holding what livehuddle keeps for the person rather than for one canvas (their shape libraries).
[[durable_objects.bindings]]
name = "PERSON_STORE"
class_name = "PersonStore"

# livehuddle ships fresh on new infrastructure, so the classes start SQLite-backed with no history.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentRoom", "PersonStore", "WorkbenchStore"]

# Workbench pairings, tickets and sessions moved to liveworkspace's accounts Worker (liveworkspace/docs/specs/011-workbench/workbench.md),
# so this Worker's per-person WorkbenchStore goes, with whatever it held.
[[migrations]]
tag = "v2"
deleted_classes = ["WorkbenchStore"]

# One scheduled job: the calls budget poll every 15 minutes (docs/specs/016-platform/calls-kill-switch.md "The budget
# poll"). Everything else keeps itself: each canvas through its Durable Object's alarm (the index outbox, the
# Community check, the daily upkeep) and each person's stores theirs. Teams, tokens and the Trash are liveworkspace's.
# `triggers` is inherited, so staging runs the same cron.
[triggers]
crons = ["*/15 * * * *"]

# The calls kill switch (docs/specs/016-platform/calls-kill-switch.md): the `calls-mode` key (on, audio-only, off)
# and the budget poll's trip record. Flip it with
#   corepack pnpm exec wrangler kv key put --binding CALLS_SWITCH --remote calls-mode off
[[kv_namespaces]]
binding = "CALLS_SWITCH"
id = "9d41805f30a64ee9924394c304ddc875" # livehuddle-calls-switch

# Per-IP limiter for share-code resolution (GET /api/share/<code>). That
# read carries the optional share password and is otherwise unauthed +
# exempt from the write limiter, so without this an attacker holding a
# code could brute-force the password unbounded. 30 resolves / 60s per IP
# is ample for legit visitors. Separate namespace. Absent binding → the
# index.ts check is skipped, so a deployment still works.
[[unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-IP throttle for GET /api/unfurl (docs/specs/009-elements/link-cards.md): an unauthenticated outbound
# page fetch for link-card previews. 60/60s is plenty for a user dropping
# bookmark cards. Separate namespace. Absent binding → check skipped.
[[unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# Per-token read throttle for token-authed GETs (docs/specs/015-api/public-api-and-tokens.md §3.5): an external
# integration's reads, keyed on the token id, so one runaway script can't hammer
# reads independently of the owner's app use. Token WRITES ride
# WRITE_RATE_LIMITER (also keyed on the token id). Absent binding → allow.
[[unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# The image gallery's caps (100 images and 100 MB per person, across every app) are the media service's
# (liveworkspace/docs/specs/006-media/media.md "Uploads"), not this worker's.

# Transactional & lifecycle email (docs/specs/014-identity/transactional-email.md) goes out through
# Cloudflare Email Service (liveworkspace/docs/specs/003-accounts/email.md). No API key: the `send_email` binding below is the
# credential, and without it the whole email feature is inert — no sends, and the email_lifecycle table is
# never touched, so a deployment with email off (a fork that drops the binding) does zero extra work:
#
#   - EMAIL: the `send_email` binding. `wrangler dev` simulates it, printing each email and saving it to a
#     file, so nothing is sent locally.
#   - EMAIL_FROM: [vars] From identity. Its domain must be onboarded to Email Service on this account;
#     livehuddle.app isn't yet, so it sends from liveplanner.app until that domain moves.
#   - APP_BASE_URL: optional [vars] public origin for links in emails (hosted-vars.json per environment).
#     Defaults to "https://www.livehuddle.app".
[[send_email]]
name = "EMAIL"

# Sign-in (docs/specs/014-identity/auth-and-guest-access.md) goes through the
# liveworkspace accounts Worker. Four values, provisioned out-of-band so none
# lands in the public repo (docs/specs/002-project-scope/secrets-policy.md):
#
#   ACCOUNTS_URL            the accounts Worker's origin
#                           (https://www.liveworkspace.app)
#   API_RESOURCE            this API's registered resource, the access
#                           token's audience (https://livehuddle.app/api)
#   ACCOUNTS_CLIENT_ID      this app's OAuth client id
#   ACCOUNTS_CLIENT_SECRET  its client secret (the only real secret)
#
#   - Local dev: put them in `apps/api/.dev.vars` (gitignored), plus
#     AUTH_ORIGIN=http://localhost:3500 so the callback comes back
#     through the router. Wrangler reads it on the next `wrangler dev`.
#   - Production: Cloudflare Worker secrets, set once with `wrangler secret put <NAME>` (docs/ci.md). No
#     workflow sets them: the deploy only carries CLOUDFLARE_API_TOKEN, so a value rotates by putting it again.
#     Secrets persist across deploys independently of this file.
#
# Guests are liveworkspace's too: the accounts Worker hands each browser a
# guest token for this API (liveworkspace/docs/specs/003-accounts/accounts.md "Guests"), checked
# with the same keys. With ACCOUNTS_URL or API_RESOURCE unset no caller has an
# identity and only share-link visitors are served
# (docs/specs/014-identity/auth-and-guest-access.md + docs/specs/015-api/api.md).
# The client id and secret come from registering livehuddle with the
# accounts Worker (liveworkspace/docs/specs/002-architecture/integrating-an-app.md).

# TELEMETRY_KEY is livehuddle's secret on the liveworkspace telemetry service
# (liveworkspace/docs/specs/008-telemetry/telemetry.md): sent as X-Telemetry-Key, it proves a batch with
# no Origin (this worker's own events, the relay's) is livehuddle's.
# Provisioned out-of-band like the two above; never in [vars] — it is secret material:
#
#   - Local dev: `TELEMETRY_KEY=dev-livehuddle-key` in `apps/api/.dev.vars`
#     (gitignored), matching the local service's .dev.vars.
#   - Production: `wrangler secret put TELEMETRY_KEY`, the SAME value on the
#     liveworkspace service as TELEMETRY_KEY_LIVEHUDDLE.
#     Generate with `openssl rand -hex 32`.
#
# Unset = this worker sends no telemetry, which is what a deployment gets with no
# configuration. A mismatch is silent (the service drops the batch), so check
# `wrangler secret list` on all three if server-side counts look flat.

# COMMUNITY_KEY is livehuddle's secret on the liveworkspace Community service
# (liveworkspace/docs/specs/007-community/community.md), sent as a bearer token on its app routes, where
# it proves a publish, a sync or a copy is livehuddle's. The service holds the same
# value as COMMUNITY_KEY_LIVEHUDDLE. Never in [vars]:
#
#   - Local dev: `COMMUNITY_KEY=dev-livehuddle-community-key` and
#     `COMMUNITY_URL=http://localhost:8791/api/community` in `apps/api/.dev.vars`.
#   - Production and staging: `wrangler secret put COMMUNITY_KEY` (and `--env staging`). COMMUNITY_URL comes from hosted-vars.json.
#
# Unset = no Community: publishing answers 404, and the sync does nothing.

# MEDIA_KEY is livehuddle's secret on liveworkspace's media service (liveworkspace/docs/specs/006-media/media.md,
# src/media.ts), which keeps every app's uploaded images. The service holds the same value as
# MEDIA_KEY_LIVEHUDDLE. Never in [vars]:
#
#   - Local dev: `MEDIA_KEY=dev-livehuddle-media-key` and
#     `MEDIA_URL=http://localhost:8792/api/media` in `apps/api/.dev.vars`.
#   - Production and staging: `wrangler secret put MEDIA_KEY` (and `--env staging`). MEDIA_URL comes from hosted-vars.json.
#
# Unset = no images: the image endpoints answer 503 and the editor hides the Image entry.

# DRIVE_KEY is livehuddle's secret on liveworkspace's Drive mirror (liveworkspace/docs/specs/005-drive/drive.md
# "Contracts > The apps"); the service holds the same value as DRIVE_KEY_LIVEHUDDLE. It opens the
# internal export door's `file` format and the import door, nothing else. Never in [vars]:
#
#   - Local dev: `DRIVE_KEY=dev-livehuddle-drive-key` in `apps/api/.dev.vars`.
#   - Production and staging: `wrangler secret put DRIVE_KEY` (and `--env staging`).
#
# Unset = the mirror cannot export or import canvases (the two doors take only the index's key).

# DATA_EXPORT_KEY is livehuddle's secret on liveworkspace's data export (liveworkspace/docs/specs/003-accounts/data-export.md
# "The apps' doors"); the service holds the same value as DATA_EXPORT_KEY_LIVEHUDDLE. It opens the internal export
# door alone, in every format (its `comments` format is the data export's own), nothing else. Never in [vars]:
#
#   - Local dev: `DATA_EXPORT_KEY=dev-livehuddle-data-export-key` in `apps/api/.dev.vars`.
#   - Production and staging: `wrangler secret put DATA_EXPORT_KEY` (and `--env staging`).
#
# Unset = Download All My Data cannot read Spaces: it names each one under Not included and carries on.

# Proximity audio (docs/specs/012-collaboration/proximity-audio.md "The mint route"): REALTIME_APP_ID and
# REALTIME_APP_TOKEN name the Cloudflare Realtime SFU app this worker mints sessions and tracks on, and TURN_KEY_ID and
# TURN_KEY_API_TOKEN the TURN key it mints short-lived ICE credentials from. No binding: four secrets, the owner's to
# create, never in [vars]:
#
#   - Staging: `wrangler secret put <NAME> --env staging` for each.
#   - Production: `wrangler secret put <NAME>` (no --env) for each, on `livehuddle-api`. The calls kill switch
#     (CALLS_SWITCH above) can still pause calls there or hold them to audio only.
#
# Unset = calls are off: /api/capabilities says so and the editor shows no audio controls.


# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `livehuddle-api-staging` via
# `wrangler deploy --env staging`.
#
# Everything below is restated ON PURPOSE. Wrangler does NOT inherit
# bindings into a named environment: `vars`, `r2_buckets`,
# `durable_objects`, `migrations` and `unsafe` are all non-inheritable, so a
# block omitted here is a binding MISSING from the deployed staging worker,
# with no warning. Only `main`, `compatibility_date`, `rules` and `triggers`
# carry over from the production config above.
#
# The values that genuinely differ from production are the
# R2 bucket, and the vars that name the public origin. Everything
# else agreeing with production is the point: staging is a rehearsal.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livehuddle-api-staging"

# TELEMETRY_ENABLED, TELEMETRY_URL and the image caps come from `hosted-vars.json`, exactly as
# for production (see the top of this file). Staging's events go to the STAGING telemetry
# service (staging.liveworkspace.app/api/telemetry), never into production's published numbers.
[env.staging.vars]
# APP_BASE_URL comes from `hosted-vars.json` per environment, so staging's email links point
# back at staging (docs/specs/014-identity/transactional-email.md).
EMAIL_FROM = "livehuddle <hello@livehuddle.app>"

# The calls budget poll's settings, as production's (both price the same account's usage). To rehearse a trip
# without spending, set CALLS_USAGE_TEST_GB here (for example "1300" trips audio only, "1600" off) and deploy.
CALLS_AUDIO_ONLY_AT_USD = "10"
CALLS_OFF_AT_USD = "25"
CALLS_USAGE_ACCOUNT_ID = "851be7d244b76a6557bcbe6c4ded80f5"

# Rate limiters. Namespace ids deliberately MATCH production's: Cloudflare
# scopes a namespace per script, and `livehuddle-api-staging` is a different
# script, so these are already separate counters. Renumbering them would
# imply the number carries meaning across workers, which it doesn't.
[[env.staging.unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[env.staging.unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# A different script is a different Durable Object namespace, so staging's
# DOCUMENT_ROOM instances are separate from production's for free. The class
# still needs its own migration tag in this environment.
[[env.staging.durable_objects.bindings]]
name = "DOCUMENT_ROOM"
class_name = "DocumentRoom"

[[env.staging.durable_objects.bindings]]
name = "PERSON_STORE"
class_name = "PersonStore"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentRoom", "PersonStore", "WorkbenchStore"]

[[env.staging.migrations]]
tag = "v2"
deleted_classes = ["WorkbenchStore"]

# Email Service's binding, restated because bindings don't inherit. Staging sends real email, to the same
# people production would (docs/specs/016-platform/staging-environment.md), from the same sender.
[[env.staging.send_email]]
name = "EMAIL"

# The calls switch, restated because bindings don't inherit: staging's own namespace, so a rehearsal never flips
# production's calls.
[[env.staging.kv_namespaces]]
binding = "CALLS_SWITCH"
id = "a4a1dde286e1495e91a798641bc2d4b6" # livehuddle-calls-switch-staging


# The four ACCOUNTS_* / API_RESOURCE values and
# TELEMETRY_KEY are set once on the staging Worker with
# `wrangler secret put <NAME> --env staging` (docs/ci.md), not by CI.
# Worker secrets are per-environment, so staging's never collide with
# production's.
