<!doctype html>
<!--
  A fake workbench for the workbench embed e2e (docs/specs/013-workspace/blueprints/workbench-embeds.md,
  "Testing"). The test hands it the frame URL with `window.openFrame(url)` after load (never through its own
  address): only http or https on a loopback host is framed, anything else is refused on the page. It answers
  `hello` with `hello-ack` (unless `?silent=1`), answers `renew` with the ticket the test leaves in
  `window.nextTicket`, and records every message the frame sends into `window.received`.
  `window.post(message)` sends one to the frame.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fake Workbench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="livediagram"></iframe>
    <p id="refused" role="alert" hidden></p>
    <script>
      const LOOPBACK_HOSTS = ['localhost', '127.0.0.1', '[::1]'];
      const silent = new URLSearchParams(location.search).get('silent') === '1';
      const frame = document.getElementById('frame');
      let liveOrigin = null;
      window.received = [];
      window.nextTicket = null;
      window.post = (message) => frame.contentWindow.postMessage(message, liveOrigin);
      window.openFrame = (value) => {
        let url;
        try {
          url = new URL(value);
        } catch {
          url = null;
        }
        const allowed =
          url !== null &&
          (url.protocol === 'http:' || url.protocol === 'https:') &&
          LOOPBACK_HOSTS.includes(url.hostname);
        if (!allowed) {
          const refused = document.getElementById('refused');
          refused.textContent =
            'Refused: the fake workbench frames only an http(s) loopback address.';
          refused.hidden = false;
          return false;
        }
        liveOrigin = url.origin;
        frame.src = url.href;
        return true;
      };
      addEventListener('message', (event) => {
        if (liveOrigin === null || event.origin !== liveOrigin) return;
        if (event.source !== frame.contentWindow) return;
        const message = event.data;
        window.received.push(message);
        if (message.type === 'livediagram:hello' && !silent) {
          window.post({ type: 'livediagram:hello-ack', v: 1, name: 'Fake Workbench' });
        }
        if (message.type === 'livediagram:renew' && window.nextTicket) {
          window.post({ type: 'livediagram:ticket', v: 1, ticket: window.nextTicket });
          window.nextTicket = null;
        }
      });
    </script>
  </body>
</html>
