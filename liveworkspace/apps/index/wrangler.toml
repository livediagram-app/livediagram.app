name = "liveworkspace-index"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# global_fetch_strictly_public: a fetch() to another Worker's workers.dev address on this account fails (1042) without it, and
# livediagram answers on workers.dev stand-ins until its domain moves (stand-in-addresses.md).
compatibility_flags = ["global_fetch_strictly_public"]
# Only its API, /api/index, on liveworkspace.app (liveworkspace/docs/index-service.md). Browsers reach it
# through their own app's router, which forwards /api/index/* on the app's origin here.
routes = [{ pattern = "liveworkspace.app/api/index*", zone_name = "liveworkspace.app" }]
workers_dev = false

# Secrets (wrangler secret put):
#   INDEX_KEY_LIVEDIAGRAM, INDEX_KEY_LIVEPLANNER, INDEX_KEY_LIVEDOCUMENTS, INDEX_KEY_LIVEDESIGN
#     each shared with that app as INDEX_KEY: the app's server pushes summaries and comments with it,
#     and the index calls the app's internal routes (copy, purge, revoke) with it.
#   GRANT_SIGNING_KEY   the private ES256 JWK (with its kid) grants are signed with; its public half
#                       is served at /api/index/jwks.
#   MERGE_KEY           accounts' INDEX_MERGE_KEY: it moves a guest's things to their new account.
#   INDEX_KEY_DRIVE     the Drive mirror's INDEX_KEY_DRIVE: it acts for a person on their personal items and
#                       folders, and sets their drive_mirrored flag (liveworkspace/docs/drive.md).
#   DRIVE_KEY_INDEX     the Drive mirror's DRIVE_KEY_INDEX: the index's change signal carries it.
[vars]
ENVIRONMENT = "production"
# The accounts origin: access and guest tokens are checked against `${ACCOUNTS_URL}/api/auth`, and
# grants are issued as `${ACCOUNTS_URL}/api/index`.
ACCOUNTS_URL = "https://liveworkspace.app"
# Every app's API resource: an access or guest token addressed to any of them is let in.
INDEX_AUDIENCES = "https://livediagram-router.liveworkspace-easing509.workers.dev/api,https://liveplanner.app/api,https://livedocuments.app/api,https://livedesign.app/api"
# Where the index calls each app's internal routes.
APP_ORIGIN_LIVEDIAGRAM = "https://livediagram-router.liveworkspace-easing509.workers.dev"
APP_ORIGIN_LIVEPLANNER = "https://liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://livedesign.app"

# Its own database, apart from accounts and every other service's data. The id is a placeholder: the
# database is created on first deploy (liveworkspace/docs/index-service.md "First deploy").
[[d1_databases]]
binding = "INDEX_DB"
database_name = "liveworkspace-index"
database_id = "72bee473-8f70-472f-ac1d-2d914e74c53e"
migrations_dir = "migrations"

# Once a day: purge items 30 days in the Trash, and retry apps that missed a purge. Every 15 minutes
# (src/account-purge.ts FREQUENT_CRON): carry on closed accounts' purges and tell the apps what was purged.
[triggers]
crons = ["23 4 * * *", "*/15 * * * *"]

# The migration's handoff (src/migration-handoff.ts, docs/migration.md step 6), per person: a browser's Local only
# documents, a few parts each. 11xx: the platform Workers' own (accounts' 1103 and 1105, status 1104).
[[ratelimits]]
name = "MIGRATION_LIMITER"
namespace_id = "1106"
simple = { limit = 60, period = 60 }

# The Google Drive mirror's service, which the change signal goes through (src/drive.ts). Without it
# the index sends no signal and nothing else changes.
[[services]]
binding = "DRIVE"
service = "liveworkspace-drive"

[env.staging]
name = "liveworkspace-index-staging"
routes = [{ pattern = "staging.liveworkspace.app/api/index*", zone_name = "liveworkspace.app" }]
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
# Staging's app origins and API resources: check them against each app's staging deploy before the first
# deploy here.
ACCOUNTS_URL = "https://staging.liveworkspace.app"
INDEX_AUDIENCES = "https://livediagram-router-staging.liveworkspace-easing509.workers.dev/api,https://staging.liveplanner.app/api,https://staging.livedocuments.app/api,https://staging.livedesign.app/api"
APP_ORIGIN_LIVEDIAGRAM = "https://livediagram-router-staging.liveworkspace-easing509.workers.dev"
APP_ORIGIN_LIVEPLANNER = "https://staging.liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://staging.livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://staging.livedesign.app"

# Created on first deploy, like production's.
[[env.staging.d1_databases]]
binding = "INDEX_DB"
database_name = "liveworkspace-index-staging"
database_id = "32313469-478a-493d-a9de-77e0a759d83e"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["23 4 * * *", "*/15 * * * *"]

[[env.staging.ratelimits]]
name = "MIGRATION_LIMITER"
namespace_id = "2106"
simple = { limit = 60, period = 60 }

# The Google Drive mirror on staging (liveworkspace/docs/drive.md).
[[env.staging.services]]
binding = "DRIVE"
service = "liveworkspace-drive-staging"
