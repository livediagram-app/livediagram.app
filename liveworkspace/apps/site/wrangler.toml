name = "liveworkspace-site"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
compatibility_date = "2026-05-29"
# Every page of liveworkspace.app (liveworkspace/docs/site.md "Hosting"). The APIs have more
# specific routes, so they win: accounts (/api/auth/*, /api/account/* and the two .well-known documents),
# the index, media, telemetry and the Community (/api/index*, /api/media*, /api/previews*, /api/telemetry*,
# /api/community*).
# Until liveworkspace.app is on this account, the gateway routes here instead (docs/gateway.md); put these back then:
# routes = [
#   { pattern = "liveworkspace.app/*", zone_name = "liveworkspace.app" },
#   { pattern = "www.liveworkspace.app/*", zone_name = "liveworkspace.app" },
# ]
workers_dev = false

# Static assets only: the Next export in ./out. Headers come from public/_headers.
[assets]
directory = "./out"
not_found_handling = "404-page"

[env.staging]
name = "liveworkspace-site-staging"
# Until liveworkspace.app is on this account, the gateway routes here instead (docs/gateway.md); put these back then:
# routes = [{ pattern = "staging.liveworkspace.app/*", zone_name = "liveworkspace.app" }]
workers_dev = false

[env.staging.assets]
directory = "./out"
not_found_handling = "404-page"
