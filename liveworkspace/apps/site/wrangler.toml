name = "liveworkspace-site"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
compatibility_date = "2026-05-29"
# global_fetch_strictly_public: a fetch() to another Worker's route on this zone (liveworkspace.app) isn't routed to
# that Worker without it (docs/specs/009-status/status.md "Where the checks go").
compatibility_flags = ["global_fetch_strictly_public"]
# Every page of liveworkspace.app (liveworkspace/docs/specs/010-site/site.md "Hosting"). Custom domains, so a deploy creates their
# DNS records and certificates. The APIs' path routes on the same hosts win over a custom domain: accounts
# (/api/auth/*, /api/account/* and the two .well-known documents), the index, media, telemetry, the Community,
# status and Drive (/api/index*, /api/media*, /api/previews*, /api/telemetry*, /api/community*, /api/status*,
# /api/drive*).
routes = [
  { pattern = "liveworkspace.app", custom_domain = true },
  { pattern = "www.liveworkspace.app", custom_domain = true },
]
workers_dev = false

# Static assets only: the Next export in ./out. Headers come from public/_headers.
[assets]
directory = "./out"
not_found_handling = "404-page"

[env.staging]
name = "liveworkspace-site-staging"
routes = [{ pattern = "staging.liveworkspace.app", custom_domain = true }]
workers_dev = false

[env.staging.assets]
directory = "./out"
not_found_handling = "404-page"
