name = "liveworkspace-community"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# global_fetch_strictly_public: a fetch() to another Worker's route on this zone (liveworkspace.app) isn't routed to
# that Worker without it (docs/specs/009-status/status.md "Where the checks go").
compatibility_flags = ["global_fetch_strictly_public"]
# Only its API, /api/community, on liveworkspace.app (liveworkspace/docs/specs/007-community/community.md). liveworkspace.app
# hosts no Community pages: each app serves its own, which read from here.
routes = [
  { pattern = "www.liveworkspace.app/api/community*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/community*", zone_name = "liveworkspace.app" },
]
workers_dev = false

# Secrets (wrangler secret put): each app's Worker key, sent as a bearer token on the app routes.
#   COMMUNITY_KEY_LIVEDIAGRAM   shared with livediagram's api Worker as COMMUNITY_KEY
#   COMMUNITY_KEY_LIVEPLANNER   shared with liveplanner's api Worker as COMMUNITY_KEY
#   COMMUNITY_KEY_LIVEDOCUMENTS shared with livedocuments' api Worker as COMMUNITY_KEY
#   COMMUNITY_KEY_LIVEDESIGN    shared with livedesign's api Worker as COMMUNITY_KEY
#   COMMUNITY_KEY_LIVEHUDDLE    shared with livehuddle's api Worker as COMMUNITY_KEY
# Each also opens that app's sweep door, so the sweep needs no other secret.
[vars]
ENVIRONMENT = "production"
# Where each app answers the sweep's door (/api/internal/items/community-states), called with that app's key above
# (liveworkspace/docs/specs/007-community/community.md "The sweep").
APP_ORIGIN_LIVEDIAGRAM = "https://www.livediagram.app"
APP_ORIGIN_LIVEPLANNER = "https://www.liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://www.livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://www.livedesign.app"
APP_ORIGIN_LIVEHUDDLE = "https://www.livehuddle.app"
# The Forum's account check (liveworkspace/docs/specs/007-community/community.md "Forum routes"): access tokens are
# checked offline against `${ACCOUNTS_URL}/api/auth`'s keys, addressed to any app API, as the index and Drive check them.
ACCOUNTS_URL = "https://www.liveworkspace.app"
INDEX_AUDIENCES = "https://livediagram.app/api,https://liveplanner.app/api,https://livedocuments.app/api,https://livedesign.app/api,https://livehuddle.app/api"

# Every five minutes: the sweep checks each app's posts checked longest ago against the index, through the app, and the
# Forum's posts waiting for the check are asked again.
[triggers]
crons = ["*/5 * * * *"]

# Its own database, apart from accounts, telemetry and every app's own data.
[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "liveworkspace-community"
database_id = "3547c10c-39db-4b76-85b9-65ca47362166"
migrations_dir = "migrations"

# Per-network budget for likes and reports, whose callers are anonymous: counted at Cloudflare's edge, so
# it holds across isolates.
[[ratelimits]]
name = "COMMUNITY_RATE_LIMITER"
namespace_id = "1102"
simple = { limit = 30, period = 60 }

# Accounts, which access tokens' key set is fetched through (src/forum/account.ts): a Worker's fetch to another Worker's
# route on its own zone can stall. Without it the public route is used.
[[services]]
binding = "ACCOUNTS"
service = "liveworkspace-accounts"

# Workers AI for the Forum's check (community.md "The Forum", "The check"): no key, no secret, the binding is the
# credential, billed in Neurons on this account (10,000 a day free), at most FORUM_CHECKS_PER_DAY checks a day
# (src/config.ts). Optional: without it every new Forum post waits as Pending. A local run (ENVIRONMENT development)
# never asks it: posts list as if checked, unless FORUM_CHECK_LOCAL=ai in .dev.vars asks the real check.
[ai]
binding = "AI"

[env.staging]
name = "liveworkspace-community-staging"
routes = [{ pattern = "staging.liveworkspace.app/api/community*", zone_name = "liveworkspace.app" }]
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
APP_ORIGIN_LIVEDIAGRAM = "https://staging.livediagram.app"
APP_ORIGIN_LIVEPLANNER = "https://staging.liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://staging.livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://staging.livedesign.app"
APP_ORIGIN_LIVEHUDDLE = "https://staging.livehuddle.app"
ACCOUNTS_URL = "https://staging.liveworkspace.app"
INDEX_AUDIENCES = "https://staging.livediagram.app/api,https://staging.liveplanner.app/api,https://staging.livedocuments.app/api,https://staging.livedesign.app/api,https://staging.livehuddle.app/api"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.d1_databases]]
binding = "COMMUNITY_DB"
database_name = "liveworkspace-community-staging"
database_id = "9cc861ac-3986-44c2-be30-777261832307"
migrations_dir = "migrations"

[[env.staging.ratelimits]]
name = "COMMUNITY_RATE_LIMITER"
namespace_id = "2102"
simple = { limit = 30, period = 60 }

# Bindings don't inherit into an environment: the accounts binding and Workers AI (above), restated.
[[env.staging.services]]
binding = "ACCOUNTS"
service = "liveworkspace-accounts-staging"

[env.staging.ai]
binding = "AI"
