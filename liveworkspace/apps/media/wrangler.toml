name = "liveworkspace-media"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# global_fetch_strictly_public: a fetch() to another Worker's route on this zone (liveworkspace.app) isn't routed to
# that Worker without it (docs/specs/009-status/status.md "Where the checks go").
compatibility_flags = ["global_fetch_strictly_public"]
# Its API, /api/media, on liveworkspace.app (liveworkspace/docs/specs/006-media/media.md): browsers never call it, each app's own
# Worker does, and serves the bytes to the people it lets in. And every app's previews, /api/previews
# (liveworkspace/docs/specs/006-media/previews.md): browsers do call these, on liveworkspace.app and through each app's router.
routes = [
  { pattern = "www.liveworkspace.app/api/media*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/media*", zone_name = "liveworkspace.app" },
  { pattern = "www.liveworkspace.app/api/previews*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/previews*", zone_name = "liveworkspace.app" },
]
workers_dev = false

# The share card's rasteriser (@liveworkspace/render-png/worker) imports its fonts as raw bytes: a Worker has no
# system fonts. Inheritable, so staging takes it too.
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

# Secrets (wrangler secret put): each app's Worker key, sent as a bearer token.
#   MEDIA_KEY_LIVEDIAGRAM, MEDIA_KEY_LIVEPLANNER, MEDIA_KEY_LIVEDOCUMENTS, MEDIA_KEY_LIVEDESIGN
#   shared with that app's api Worker as MEDIA_KEY. An app without one can't use the service, and the
#   unused-image sweep doesn't wait for it. Previews call that app's export door with the same key.
[vars]
# Per person, across every app: 100 images and 100 MB, as livediagram.app has today.
IMAGE_MAX_PER_OWNER = "100"
IMAGE_MAX_BYTES_PER_OWNER = "104857600"
# Previews: who may see an item is the index's to say, reached through the INDEX service binding below (a Worker's
# fetch to another Worker's route on its own zone isn't routed to it).
INDEX_URL = "https://www.liveworkspace.app/api/index"
# Where each app answers its export door (/api/internal/items/:id/export).
APP_ORIGIN_LIVEDIAGRAM = "https://www.livediagram.app"
APP_ORIGIN_LIVEPLANNER = "https://www.liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://www.livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://www.livedesign.app"

[[services]]
binding = "INDEX"
service = "liveworkspace-index"

# Its own database, apart from accounts, telemetry, the Community and every app's own data.
[[d1_databases]]
binding = "MEDIA_DB"
database_name = "liveworkspace-media"
database_id = "3933275d-680b-43b1-b446-9cbd1d94fc0d"
migrations_dir = "migrations"

# The images' bytes, keyed by image id, and every app's previews under previews/.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "liveworkspace-media"

# Retention: once a day, the unused-image sweep.
[triggers]
crons = ["41 3 * * *"]

[env.staging]
name = "liveworkspace-media-staging"
routes = [
  { pattern = "staging.liveworkspace.app/api/media*", zone_name = "liveworkspace.app" },
  { pattern = "staging.liveworkspace.app/api/previews*", zone_name = "liveworkspace.app" },
]
workers_dev = false

[env.staging.vars]
IMAGE_MAX_PER_OWNER = "100"
IMAGE_MAX_BYTES_PER_OWNER = "104857600"
INDEX_URL = "https://staging.liveworkspace.app/api/index"
APP_ORIGIN_LIVEDIAGRAM = "https://staging.livediagram.app"
APP_ORIGIN_LIVEPLANNER = "https://staging.liveplanner.app"
APP_ORIGIN_LIVEDOCUMENTS = "https://staging.livedocuments.app"
APP_ORIGIN_LIVEDESIGN = "https://staging.livedesign.app"

[[env.staging.services]]
binding = "INDEX"
service = "liveworkspace-index-staging"

[[env.staging.d1_databases]]
binding = "MEDIA_DB"
database_name = "liveworkspace-media-staging"
database_id = "67d8d63c-db99-4dbd-ba1f-62a0d1e1efc1"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "liveworkspace-media-staging"

[env.staging.triggers]
crons = ["41 3 * * *"]
