name = "liveworkspace-status"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# global_fetch_strictly_public: its checks of liveworkspace.app go out and come back in through the zone's routes
# (docs/status.md "Where the checks go"); without it a fetch to a route on its own zone isn't routed to that Worker.
compatibility_flags = ["global_fetch_strictly_public"]
# Only its API, /api/status, on liveworkspace.app: the page at /status is the static site's (apps/site).
routes = [
  { pattern = "www.liveworkspace.app/api/status*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/status*", zone_name = "liveworkspace.app" },
]
workers_dev = false

# No secrets. Every check is a public address (docs/status.md).
[vars]
ENVIRONMENT = "production"
# liveworkspace.app's origin, where its own services are checked.
PLATFORM_ORIGIN = "https://www.liveworkspace.app"

# Its own database: every check for 90 days, the daily rollups, the incidents and the two answers it serves.
[[d1_databases]]
binding = "STATUS_DB"
database_name = "liveworkspace-status"
database_id = "9430bdaf-7819-41d4-8cb6-7aec451488b6"
migrations_dir = "migrations"

# livediagram stands in on this account's workers.dev until livediagram.app moves (STAND_INS, @liveworkspace/sites;
# livediagram/docs/specs/016-platform/stand-in-addresses.md), so its checks go through its Workers' bindings too.
[[services]]
binding = "LIVEDIAGRAM_ROUTER"
service = "livediagram-router"

[[services]]
binding = "LIVEDIAGRAM_MCP"
service = "livediagram-mcp"

# Per-network budget for reads the edge cache missed: each is one D1 row, so this only stops a flood.
[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "1104"
simple = { limit = 60, period = 60 }

# Every hour, at minute 7: check every service, store it, roll up the day, prune past 90 days.
[triggers]
crons = ["7 * * * *"]

[env.staging]
name = "liveworkspace-status-staging"
routes = [{ pattern = "staging.liveworkspace.app/api/status*", zone_name = "liveworkspace.app" }]
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
PLATFORM_ORIGIN = "https://staging.liveworkspace.app"

[[env.staging.d1_databases]]
binding = "STATUS_DB"
database_name = "liveworkspace-status-staging"
database_id = "2cdd405e-c958-4a25-b65d-878b83901230"
migrations_dir = "migrations"

[[env.staging.services]]
binding = "LIVEDIAGRAM_ROUTER"
service = "livediagram-router-staging"

[[env.staging.ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "2104"
simple = { limit = 60, period = 60 }

[env.staging.triggers]
crons = ["7 * * * *"]
