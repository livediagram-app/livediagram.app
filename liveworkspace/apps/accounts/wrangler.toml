name = "liveworkspace-accounts"
# The liveworkspace Cloudflare account, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# Better Auth reads AsyncLocalStorage from node:async_hooks.
# global_fetch_strictly_public: a fetch() to another Worker's workers.dev address on this account fails (1042) without it, and
# livediagram answers on workers.dev stand-ins until its domain moves (stand-in-addresses.md).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# The accounts API on liveworkspace.app: /api/auth/*, /api/account/* and the two discovery documents, on www. (its
# address, BASE_URL) and on the bare domain for clients from before the move (liveworkspace/docs/accounts.md "The move
# to www."). The other /api/* paths are the other platform Workers', and everything else the static site's
# (apps/site). Each route is more specific than the bare domain's redirect (apps/redirect, liveworkspace.app/*), so
# it wins.
routes = [
  { pattern = "www.liveworkspace.app/api/auth/*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/auth/*", zone_name = "liveworkspace.app" },
  { pattern = "www.liveworkspace.app/api/account/*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/api/account/*", zone_name = "liveworkspace.app" },
  { pattern = "www.liveworkspace.app/.well-known/openid-configuration*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/.well-known/openid-configuration*", zone_name = "liveworkspace.app" },
  { pattern = "www.liveworkspace.app/.well-known/oauth-authorization-server*", zone_name = "liveworkspace.app" },
  { pattern = "liveworkspace.app/.well-known/oauth-authorization-server*", zone_name = "liveworkspace.app" },
]
workers_dev = false

# Secrets (wrangler secret put, or .dev.vars locally; see .dev.vars.example):
#   BETTER_AUTH_SECRET    signs cookies and the OAuth query; 32+ random bytes
#   TURNSTILE_SECRET_KEY  Turnstile on "send code"
#   ADMIN_TOKEN           guards POST /api/auth/internal/clients (registering an app)
#   GOOGLE_CLIENT_ID      "Continue with Google"; optional, the button only shows with both
#   GOOGLE_CLIENT_SECRET
#   INDEX_MERGE_KEY       accounts' key on the index: POST /internal/merge when a guest signs in, and
#                         POST /internal/purge-person when an account closes
#   DRIVE_KEY_ACCOUNTS    accounts' key on the Google Drive mirror (the drive Worker's DRIVE_KEY_ACCOUNTS):
#                         DELETE /app/people/<id> when an account closes (src/drive-disconnect.ts); optional,
#                         without it (or the DRIVE binding) nothing is sent
#   TELEMETRY_KEY_LIVEDIAGRAM, TELEMETRY_KEY_LIVEPLANNER, TELEMETRY_KEY_LIVEDOCUMENTS,
#   TELEMETRY_KEY_LIVEDESIGN
#                         each app's key on the telemetry service (the telemetry Worker's values), to
#                         count Email·Sent for the onboarding emails under the app each speaks for;
#                         optional, an app without one isn't counted
#   LEGACY_GUEST_ID_HMAC_SECRET
#                         the old livediagram.app's GUEST_ID_HMAC_SECRET (from its repository's GitHub secrets), for
#                         the migration's returning guests (src/legacy-guests.ts); unset, that route is a plain 404.
#                         Set for the migration and removed after it (docs/migration.md step 6)
[vars]
ENVIRONMENT = "production"
BASE_URL = "https://www.liveworkspace.app"
# The index service, told when a guest signs in (src/guests.ts) and when an account closes
# (src/index-purge.ts), reached through the INDEX service binding below: a Worker's fetch to another
# Worker's route on its own zone isn't routed to it. Unset, or without INDEX_MERGE_KEY, the merge is
# skipped and a closed account's purge waits in pending_purges until it is set.
INDEX_URL = "https://www.liveworkspace.app/api/index"
# On liveplanner.app until liveworkspace.app is on this account and onboarded to Email Service (docs/email.md).
EMAIL_FROM = "sign-in@liveplanner.app"
TURNSTILE_SITE_KEY = "0x4AAAAAAFlfZFYIdJsaQor8"
# The telemetry service (src/telemetry.ts), reached through the TELEMETRY service binding below.
TELEMETRY_URL = "https://www.liveworkspace.app/api/telemetry"
# Signing in on each app's own address (src/handoff.ts): the sign-in pages are served under the app's address, and
# a one-time hop brings the session here. Every app's router must serve them before this is "true".
SIGN_IN_ON_APP_ORIGINS = "true"
# "true" once each app origin's /api/workspace/auth/callback/google is an authorised redirect URI of the Google client
# (liveworkspace/docs/accounts.md "Before deploy"). Until then Google signs in on this site's own page, as before.
GOOGLE_ON_APP_ORIGINS = "false"

# Every email goes out through Cloudflare Email Service (docs/email.md).
[[send_email]]
name = "EMAIL"

[[services]]
binding = "INDEX"
service = "liveworkspace-index"

[[services]]
binding = "TELEMETRY"
service = "liveworkspace-telemetry"

# The Google Drive mirror's service, told when an account closes (src/drive-disconnect.ts). Without it
# nothing is sent.
[[services]]
binding = "DRIVE"
service = "liveworkspace-drive"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "liveworkspace-accounts"
database_id = "b682a5c0-519b-4085-93c7-7708985acb30"
migrations_dir = "migrations"

# Workers Rate Limiting: counted at Cloudflare's edge, so it holds across isolates, unlike
# Better Auth's built-in limiter, which on Workers would only count per isolate.
[[ratelimits]]
name = "CODE_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CODE_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# GET /api/auth/guest: once per browser per app, so generous enough for an office behind one IP.
[[ratelimits]]
name = "GUEST_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# The doors that need no session: a team join link's preview and an invitation's Decline link
# (liveworkspace/docs/accounts.md), per network.
[[ratelimits]]
name = "TEAM_LINK_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# A workbench token's ticket mints and pairing requests (src/workbench/routes.ts), per token: the
# apps' WORKBENCH_TICKETS_PER_MINUTE.
[[ratelimits]]
name = "WORKBENCH_LIMITER"
# 11xx: the platform Workers' own (telemetry 1101, community 1102), clear of the apps' 10xx.
namespace_id = "1103"
simple = { limit = 30, period = 60 }

# The migration's returning-guest claims (src/legacy-guests.ts), per caller: one per browser that finds an old id,
# so a few a minute is plenty.
[[ratelimits]]
name = "LEGACY_GUEST_LIMITER"
namespace_id = "1105"
simple = { limit = 10, period = 60 }

# Workbench pairings, tickets and sessions, one SQLite-backed store per person
# (liveworkspace/docs/workbench.md). Its alarm runs only while something will lapse.
[[durable_objects.bindings]]
name = "WORKBENCH"
class_name = "WorkbenchStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkbenchStore"]

# The daily sweep of team invitations: reminders, then expiry (src/teams.ts sweepInvitations), and of
# guests who can never come back (src/guest-sweep.ts). Every 15 minutes: closed accounts' index purges
# not yet taken are sent again (src/index-purge.ts).
[triggers]
crons = ["17 9 * * *", "*/15 * * * *"]

[env.staging]
name = "liveworkspace-accounts-staging"
routes = [
  { pattern = "staging.liveworkspace.app/api/auth/*", zone_name = "liveworkspace.app" },
  { pattern = "staging.liveworkspace.app/api/account/*", zone_name = "liveworkspace.app" },
  { pattern = "staging.liveworkspace.app/.well-known/openid-configuration*", zone_name = "liveworkspace.app" },
  { pattern = "staging.liveworkspace.app/.well-known/oauth-authorization-server*", zone_name = "liveworkspace.app" },
]
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
BASE_URL = "https://staging.liveworkspace.app"
INDEX_URL = "https://staging.liveworkspace.app/api/index"
# On liveplanner.app until liveworkspace.app is on this account and onboarded to Email Service (docs/email.md).
EMAIL_FROM = "sign-in@liveplanner.app"
TURNSTILE_SITE_KEY = "0x4AAAAAAFlfZFYIdJsaQor8"
TELEMETRY_URL = "https://staging.liveworkspace.app/api/telemetry"
SIGN_IN_ON_APP_ORIGINS = "true"
GOOGLE_ON_APP_ORIGINS = "false"

[[env.staging.send_email]]
name = "EMAIL"

[[env.staging.services]]
binding = "INDEX"
service = "liveworkspace-index-staging"

[[env.staging.services]]
binding = "TELEMETRY"
service = "liveworkspace-telemetry-staging"

# The Google Drive mirror on staging (liveworkspace/docs/drive.md).
[[env.staging.services]]
binding = "DRIVE"
service = "liveworkspace-drive-staging"

[[env.staging.d1_databases]]
binding = "AUTH_DB"
database_name = "liveworkspace-accounts-staging"
database_id = "e008f4dd-67de-4bef-994f-930a7ab341aa"
migrations_dir = "migrations"

[[env.staging.ratelimits]]
name = "CODE_IP_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "CODE_EMAIL_LIMITER"
namespace_id = "2002"
simple = { limit = 3, period = 60 }

[[env.staging.ratelimits]]
name = "GUEST_LIMITER"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "TEAM_LINK_LIMITER"
namespace_id = "2004"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "WORKBENCH_LIMITER"
namespace_id = "2103"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "LEGACY_GUEST_LIMITER"
namespace_id = "2105"
simple = { limit = 10, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "WORKBENCH"
class_name = "WorkbenchStore"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkbenchStore"]

[env.staging.triggers]
crons = ["17 9 * * *", "*/15 * * * *"]
