name = "liveworkspace-marketing"
compatibility_date = "2026-05-29"
# Every path of liveworkspace.app but /telemetry, whose more specific route belongs to the telemetry
# Worker (liveworkspace/docs/marketing-site.md "Hosting").
routes = [
  { pattern = "liveworkspace.app/*", zone_name = "liveworkspace.app" },
  { pattern = "www.liveworkspace.app/*", zone_name = "liveworkspace.app" },
]

# Static assets only: the Next export in ./out. Headers come from public/_headers.
[assets]
directory = "./out"
not_found_handling = "404-page"

[env.staging]
name = "liveworkspace-marketing-staging"
routes = [{ pattern = "staging.liveworkspace.app/*", zone_name = "liveworkspace.app" }]

[env.staging.assets]
directory = "./out"
not_found_handling = "404-page"
