# liveplanner MCP server (docs/specs/015-api/mcp-server.md). Its own Worker + hostname
# (mcp.liveplanner.app), separate from the api worker — distinct dependency
# surface (MCP SDK, OAuth/KV, the resvg WASM rasteriser) and public origin.
name = "liveplanner-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# nodejs_compat for the MCP SDK's transport internals; WASM modules (resvg) are
# bundled by wrangler directly.
compatibility_flags = ["nodejs_compat"]

# Pin a fixed local dev port so `pnpm dev` doesn't race the api worker:
# both `wrangler dev` invocations otherwise default to 8787. liveplanner runs
# its stack on its own ports so it can sit beside a livediagram checkout:
# the api takes 8887, mcp 8888. Dev-only, no effect on the deployed worker.
[dev]
port = 8888

# Bundle the embedded fonts (packages/render-png/fonts/Inter-Regular.ttf, Inter-Bold.otf) as raw bytes so render.ts
# can hand it to resvg as a fontBuffer — Workers have no system fonts, so
# without this the PNG renders shapes but no text (docs/specs/015-api/mcp-server.md §5).
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

[vars]
# Where the OAuth consent page lives (apps/live). Other deployments set their own
# live origin; the authorize endpoint redirects the signed-in user here.
CONSENT_BASE_URL = "https://liveplanner.app"

# INTERNAL_EVENTS_KEY is deliberately NOT here — it's secret material, so it
# goes through `wrangler secret put INTERNAL_EVENTS_KEY` (docs/specs/002-project-scope/secrets-policy.md), and the
# api worker needs the SAME value. It marks this worker's telemetry posts as
# internal so they skip the anonymous per-IP rate-limit bucket that was
# silently throttling them (docs/specs/017-telemetry/telemetry.md, issue #36). Optional: unset on either
# side just restores the old shared-bucket behaviour, so a deployment that
# doesn't run telemetry can ignore it. See apps/api/wrangler.toml for the
# full rationale and apps/mcp/.env.example for the operator summary.

# Its own hostname `mcp.liveplanner.app` (docs/specs/015-api/mcp-server.md) — NOT declared here. Like
# every other worker on this platform (the router included), the public hostname
# is attached in the Cloudflare dashboard, not via wrangler: the deploy
# CF_API_TOKEN is scoped to upload worker scripts, not manage zone routes / DNS.
# Attach the custom domain once under Workers → liveplanner-mcp → Domains &
# Routes. Other deployments do the same with their own host, then point
# CONSENT_BASE_URL + the live app's NEXT_PUBLIC_MCP_ORIGIN at it.

# Reach the api worker over a service binding (not public DNS). Every tool
# forwards to /api/* carrying the caller's `Authorization: Bearer lvd_…`
# token, which the api already accepts on every route (docs/specs/015-api/public-api-and-tokens.md §3.3), so no
# api authorization change is needed for the tools (docs/specs/015-api/mcp-server.md §2).
[[services]]
binding = "API"
service = "liveplanner-api"

# OAuth 2.1 state (docs/specs/015-api/mcp-server.md §3): client registrations, authorize sessions, and
# codes — all short TTLs. Provision with `wrangler kv namespace create OAUTH_KV`
# and paste the id here (the api worker needs no KV; token storage stays in D1).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000040008000000000000001"

# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `liveplanner-mcp-staging` on its own host,
# `mcp-staging.liveplanner.app` (attached in the Cloudflare dashboard).
# `compatibility_flags`, `[[rules]]` and `[dev]` are inheritable and carry
# over; vars, the service binding and KV are not, so they are restated.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "liveplanner-mcp-staging"

[env.staging.vars]
# The consent page lives in the STAGING live app — a staging OAuth flow must
# never bounce the user through production's sign-in.
CONSENT_BASE_URL = "https://staging.liveplanner.app"

# Bind the staging api, not production's.
[[env.staging.services]]
binding = "API"
service = "liveplanner-api-staging"

# Own OAuth state, namespace `mcp-oauth-kv-staging` (the production one is
# `mcp-oauth-kv` — the title is NOT the binding name). Client registrations
# and authorize codes are short-TTL scratch data, so there was nothing to
# migrate across.
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000040008000000000000002"
