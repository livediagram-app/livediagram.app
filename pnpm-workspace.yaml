packages:
  # Shared by every product.
  - 'packages/*'
  # liveworkspace itself: the platform's apps, and the packages only they use.
  - 'liveworkspace/apps/*'
  - 'liveworkspace/packages/*'
  # Each product's own root is a package too, so its scripts and root configs keep working.
  - 'livediagram'
  - 'livediagram/apps/*'
  - 'livediagram/packages/*'
  - 'liveplanner'
  - 'liveplanner/apps/*'
  - 'liveplanner/packages/*'
  - 'livedesign'
  - 'livedesign/apps/*'
  - 'livedesign/packages/*'
  - 'livedocuments'
  - 'livedocuments/apps/*'
  - 'livedocuments/packages/*'
  - 'livehuddle'
  - 'livehuddle/apps/*'
  - 'livehuddle/packages/*'
