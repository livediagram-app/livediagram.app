# livediagram MCP server (docs/specs/015-api/mcp-server.md). Its own Worker + hostname
# (mcp.livediagram.app), separate from the api worker — distinct dependency
# surface (MCP SDK, OAuth/KV, the resvg WASM rasteriser) and public origin.
name = "livediagram-mcp"
# The liveworkspace Cloudflare account, which will also host livediagram.app, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# nodejs_compat for the MCP SDK's transport internals; WASM modules (resvg) are
# bundled by wrangler directly.
compatibility_flags = ["nodejs_compat"]

# Pin a fixed local dev port so `pnpm dev` doesn't race the api worker:
# both `wrangler dev` invocations otherwise default to 8787. The api takes
# 8687; mcp takes 8788. Dev-only, no effect on the deployed worker.
[dev]
port = 8788

# Bundle the embedded fonts (packages/render-png/fonts at the repo root/Inter-Regular.ttf, Inter-Bold.otf) as raw bytes so render.ts
# can hand it to resvg as a fontBuffer — Workers have no system fonts, so
# without this the PNG renders shapes but no text (docs/specs/015-api/mcp-server.md §5).
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

[vars]
# Where the OAuth consent page lives (apps/editor). Staging sets its own
# live origin; the authorize endpoint redirects the signed-in user here.
CONSENT_BASE_URL = "https://livediagram-router.liveworkspace-easing509.workers.dev"

# TELEMETRY_KEY is deliberately NOT here — it's secret material, so it goes
# through `wrangler secret put TELEMETRY_KEY` (docs/specs/002-project-scope/secrets-policy.md),
# with the SAME value as the api worker's. It is livediagram's secret on the
# liveworkspace telemetry service (docs/specs/017-telemetry/telemetry.md); unset, this
# worker sends no telemetry, so a deployment can ignore it. TELEMETRY_URL (unset:
# https://liveworkspace-gateway.liveworkspace-easing509.workers.dev/api/telemetry) names the service; staging's is set below.
# See apps/api/wrangler.toml for the full rationale and apps/mcp/.env.example for
# the operator summary.

# Its own hostname `mcp.livediagram.app` (docs/specs/015-api/mcp-server.md) is still on the previous account's
# zone, so until it moves this worker answers on its workers.dev address instead
# (docs/specs/016-platform/stand-in-addresses.md), which CONSENT_BASE_URL + the editor app's
# NEXT_PUBLIC_MCP_ORIGIN point at.

# Reach the api worker over a service binding (not public DNS). Every tool
# forwards to /api/* carrying the caller's `Authorization: Bearer lwt_…`
# token, which the api already accepts on every route (docs/specs/015-api/public-api-and-tokens.md §3.3), so no
# api authorization change is needed for the tools (docs/specs/015-api/mcp-server.md §2).
[[services]]
binding = "API"
service = "livediagram-api"

# OAuth 2.1 state (docs/specs/015-api/mcp-server.md §3): client registrations, authorize sessions, and
# codes — all short TTLs. Namespace `livediagram-mcp-oauth` (the api worker needs no KV, and API tokens are liveworkspace accounts').
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "1a32ea4a20b74c55938025fae41bb9a8"

# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `livediagram-mcp-staging` on its own host,
# `mcp-staging.livediagram.app`, its workers.dev address until that zone moves (stand-in-addresses.md).
# `compatibility_flags`, `[[rules]]` and `[dev]` are inheritable and carry
# over; vars, the service binding and KV are not, so they are restated.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livediagram-mcp-staging"

[env.staging.vars]
# The consent page lives in the STAGING editor app — a staging OAuth flow must
# never bounce the user through production's sign-in.
CONSENT_BASE_URL = "https://livediagram-router-staging.liveworkspace-easing509.workers.dev"
# Staging's events go to the staging telemetry service, never into production's numbers.
TELEMETRY_URL = "https://liveworkspace-gateway-staging.liveworkspace-easing509.workers.dev/api/telemetry"

# Bind the staging api, not production's.
[[env.staging.services]]
binding = "API"
service = "livediagram-api-staging"

# Own OAuth state, namespace `livediagram-mcp-oauth-staging` (the production one is
# `livediagram-mcp-oauth` — the title is NOT the binding name). Client registrations
# and authorize codes are short-TTL scratch data, so there was nothing to
# migrate across.
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "954c6ba27a194650bcc1ded564821527"
