# livedocuments MCP server (docs/specs/015-api/mcp-server.md). Its own Worker + hostname
# (mcp.livedocuments.app), separate from the api worker — distinct dependency
# surface (MCP SDK, OAuth/KV, the resvg WASM rasteriser) and public origin.
name = "livedocuments-mcp"
# The liveworkspace Cloudflare account, which also hosts livedocuments.app, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# nodejs_compat for the MCP SDK's transport internals; WASM modules (resvg) are
# bundled by wrangler directly.
compatibility_flags = ["nodejs_compat"]
# Its own hostname (docs/specs/016-platform/deployment.md "Custom domain"), attached by `wrangler deploy`
# with its DNS record and certificate. Another host is set here instead, then
# CONSENT_BASE_URL + the editor app's NEXT_PUBLIC_MCP_ORIGIN point at it.
routes = [{ pattern = "mcp.livedocuments.app", custom_domain = true }]

# Pin a fixed local dev port so `pnpm dev` doesn't race the api worker:
# both `wrangler dev` invocations otherwise default to 8787. livedocuments runs
# its stack on its own ports so it can sit beside livediagram and liveplanner:
# the api takes 8987, mcp 8988. Dev-only, no effect on the deployed worker.
[dev]
port = 8988

# Bundle the embedded fonts (packages/render-png/fonts at the repo root/Inter-Regular.ttf, Inter-Bold.otf) as raw bytes so render.ts
# can hand it to resvg as a fontBuffer — Workers have no system fonts, so
# without this the PNG renders shapes but no text (docs/specs/015-api/mcp-server.md §5).
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

[vars]
# Where the OAuth consent page lives (apps/editor). Staging sets its own
# editor origin; the authorize endpoint redirects the signed-in user here.
CONSENT_BASE_URL = "https://livedocuments.app"

# TELEMETRY_KEY is deliberately NOT here — it's secret material, so it goes
# through `wrangler secret put TELEMETRY_KEY` (docs/specs/002-project-scope/secrets-policy.md), the SAME
# value as the api worker's. It is livedocuments' Worker key for liveworkspace's central
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/telemetry.md): unset, this
# worker sends no telemetry. TELEMETRY_URL (a var, unset meaning production's
# https://liveworkspace-gateway.liveworkspace-easing509.workers.dev/api/telemetry) names the service. See apps/api/wrangler.toml.

# Reach the api worker over a service binding (not public DNS). Every tool
# forwards to /api/* carrying the caller's `Authorization: Bearer lwt_…`
# token, which the api already accepts on every route (docs/specs/015-api/public-api-and-tokens.md §3.3), so no
# api authorization change is needed for the tools (docs/specs/015-api/mcp-server.md §2).
[[services]]
binding = "API"
service = "livedocuments-api"

# OAuth 2.1 state (docs/specs/015-api/mcp-server.md §3): client registrations, authorize sessions, and
# codes — all short TTLs. Namespace `livedocuments-mcp-oauth` (the api worker needs no KV, and API tokens
# are liveworkspace accounts').
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "466f24e74fd8456c8264ddb0ca5b47a7"

# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `livedocuments-mcp-staging` on its own host,
# `mcp-staging.livedocuments.app`.
# `compatibility_flags`, `[[rules]]` and `[dev]` are inheritable and carry
# over; routes, vars, the service binding and KV are not, so they are restated.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livedocuments-mcp-staging"
routes = [{ pattern = "mcp-staging.livedocuments.app", custom_domain = true }]

[env.staging.vars]
# The consent page lives in the STAGING editor app — a staging OAuth flow must
# never bounce the user through production's sign-in.
CONSENT_BASE_URL = "https://staging.livedocuments.app"

# Bind the staging api, not production's.
[[env.staging.services]]
binding = "API"
service = "livedocuments-api-staging"

# Own OAuth state, namespace `livedocuments-mcp-oauth-staging` (the production one is
# `livedocuments-mcp-oauth` — the title is NOT the binding name). Client registrations
# and authorize codes are short-TTL scratch data, so there was nothing to
# migrate across.
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "014aac4ef49f4aa2a634d46bd86a42cc"
