name: Deploy Staging

# Staging deploy (docs/specs/016-platform/staging-environment.md). Automatic: every merge to `main` that passes CI
# lands on https://staging.livedocuments.app within a few minutes.
#
# Triggered by CI FINISHING, not by the push. Two reasons:
#
#   1. A red `main` must not reach staging. If staging can hold code that
#      doesn't compile, its state stops telling you anything.
#   2. The api job applies D1 migrations against a real remote database. That
#      deserves a green test suite in front of it, and it is the whole reason
#      this environment exists: the migration is rehearsed here one deploy
#      before it runs against the database holding real diagrams.
#
# The trade-off of `workflow_run` is that it checks out the default branch by
# default rather than the commit CI actually verified, so the exact SHA is
# passed down and every checkout in the reusable workflow pins to it.
on:
  # Automatic staging deploys are off until livedocuments has its own Cloudflare
  # account and secrets. Restore the workflow_run trigger (CI completed on main) then.
  # Also dispatchable by hand, for redeploying staging after changing a
  # staging-only secret or filling in a resource id — neither of which is a
  # commit, so neither triggers CI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every commit on main runs CI to the end, so their runs can finish out of
  # order. Only the commit still at main's tip deploys: an older one finishing
  # last would otherwise put staging behind main until the next merge.
  latest:
    name: Still main's tip
    # `workflow_run` fires on failure and cancellation too, so the conclusion
    # has to be checked explicitly — `types: [completed]` means "CI stopped",
    # not "CI passed". The dispatch path has no workflow_run to inspect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # A manual dispatch deploys the default branch, which is the tip by definition.
          if [ -z "${SHA}" ]; then echo "tip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${tip}" = "${SHA}" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "[deploy-staging] skipped ${SHA}: main is at ${tip}, whose own CI run deploys it"
            echo "tip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Staging
    needs: latest
    if: needs.latest.outputs.tip == 'true'
    # On the job, not the workflow, so a skipped older commit never enters the
    # group and cancels the tip's deploy. Opposite of production's: a burst of
    # merges should leave staging holding the LAST one, not queue a deploy per
    # commit. Staging tracks `main`; it is not a record of every step main took.
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      # Deploys the `[env.staging]` blocks: `-staging` worker names, staging's
      # own D1 / R2 / KV, and DEPLOY_ENV=staging on the router, which is what
      # stamps every response noindex.
      wrangler_env: staging
      environment_name: staging
      environment_url: https://staging.livedocuments.app
      # Empty on a manual dispatch, which checks out the default branch —
      # that IS `main`, so staging still tracks the right thing.
      ref: ${{ github.event.workflow_run.head_sha }}
      # Keeps a staging OAuth flow inside staging instead of bouncing the
      # user through the production MCP host.
      mcp_origin: https://mcp-staging.livedocuments.app
    secrets:
      # Same Cloudflare account as production — the isolation is drawn at the
      # resource (own D1 / R2 / KV), not the account (docs/specs/016-platform/staging-environment.md).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Every value below is staging's OWN. The ACCOUNTS_* client is staging's
      # own registration with its own resource (an audience production refuses),
      # so a staging token cannot reach production, and the
      # HMAC secret must differ or a guest id minted on staging would be
      # claimable on production.
      ACCOUNTS_URL: ${{ secrets.ACCOUNTS_URL_STAGING }}
      API_RESOURCE: ${{ secrets.API_RESOURCE_STAGING }}
      ACCOUNTS_CLIENT_ID: ${{ secrets.ACCOUNTS_CLIENT_ID_STAGING }}
      ACCOUNTS_CLIENT_SECRET: ${{ secrets.ACCOUNTS_CLIENT_SECRET_STAGING }}
      GUEST_ID_HMAC_SECRET: ${{ secrets.GUEST_ID_HMAC_SECRET_STAGING }}
      TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY_STAGING }}
