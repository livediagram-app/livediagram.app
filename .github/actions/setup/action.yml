name: Setup
description: pnpm, Node (with pnpm's store cached) and the workspace's dependencies, as every CI job needs them.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.0

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
