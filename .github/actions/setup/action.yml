name: Setup
description: pnpm, Node (with pnpm's store cached) and the workspace's dependencies, as every CI job needs them.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.0

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      # onnxruntime-node's postinstall fetches CUDA binaries on Linux x64 from GitHub. Nothing in CI runs on a GPU,
      # and a 504 from that fetch failed whole runs on main (2026-11-08).
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
