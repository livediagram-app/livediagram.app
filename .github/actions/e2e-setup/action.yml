name: E2E setup
description: >-
  pnpm, Node and the workspace's dependencies inside Playwright's container image, then a check that
  every e2e job's image carries the locked Playwright version (each product's
  docs/specs/003-system-architecture/e2e-smoke.md).

inputs:
  editor:
    description: The editor app's package, whose Playwright version the images must match.
    required: true

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.0

    # The container's own Node is replaced by the one every product builds with; no cache, since the
    # container's home differs from the runner's.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check the images match Playwright
      shell: bash
      env:
        EDITOR: ${{ inputs.editor }}
      run: |
        set -euo pipefail
        locked="$(pnpm --filter "${EDITOR}" exec playwright --version | awk '{print $2}')"
        expected="mcr.microsoft.com/playwright:v${locked}-noble"
        echo "Playwright ${locked}, expecting ${expected}"
        stale="$(grep -o 'mcr.microsoft.com/playwright:v[0-9.]*-noble' .github/workflows/e2e-product.yml | grep -vxF "${expected}" || true)"
        if [ -n "${stale}" ]; then
          echo "::error::Set every e2e-product.yml container image to ${expected} (found ${stale//$'\n'/, })"
          exit 1
        fi
