name: Coverage comment

# The pull request's coverage report as one comment (docs/specs/003-system-architecture/testing.md
# "Coverage report"): the coverage diff against its base and a row per area, from Codecov's public
# API. It runs after CI, from main's copy of this workflow and its script, so it can comment on a
# pull request from a fork too, and it never checks out or runs the pull request's code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # By hand, for a pull request, from the branch it is run on.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: true

jobs:
  comment:
    name: Coverage comment
    # Only a successful CI run has uploaded every report the comparison needs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The run's head commit, and the open pull request it belongs to (a fork's included).
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ inputs.pr }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_PR}" ]; then
            number="${DISPATCH_PR}"
            sha="$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)"
          else
            sha="${RUN_SHA}"
            number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --search "${sha}" --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${number}" ]; then
            echo "[coverage-comment] no open pull request for ${sha}; nothing to comment on"
          fi
          echo "number=${number}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Post the coverage comment
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: node scripts/coverage-comment.mjs "${PR}" "${SHA}"
