name: Deploy (reusable)

# Deploys one environment (docs/ci.md "Deploys"), called by deploy-staging.yml and
# deploy-production.yml. Only the Workers a change reaches are built and deployed: the plan compares
# the commit being deployed with the one this environment last deployed (its deploy record, a GitHub
# deployment with the task `record`: deploy-record.mjs), asks Turborepo which workspaces that reaches, dependencies included, and keeps the ones with a
# wrangler.toml. They deploy in three tiers, each waiting for the one before: the services and apis
# (D1 migrations first), then the sites, then the routers in front. Each tier runs a few jobs, not one
# per Worker (deploy-group.yml): one for the services and apis, one per product's sites, one for the
# routers, so a deploy waits for a runner a handful of times rather than once per Worker. When every
# tier has succeeded, the record moves to the deployed commit, so a failed or skipped Worker is retried
# next time. The record is a deployment, not a tag, because GITHUB_TOKEN may not move a ref across a
# change to .github/workflows/ (production went red there on 2026-11-06).
#
# Deploys write code and plain vars only. Each Worker's secrets were set on it with `wrangler secret
# put` and survive a deploy; the only credential here is CLOUDFLARE_API_TOKEN (every wrangler.toml
# pins the account).
on:
  workflow_call:
    inputs:
      environment:
        description: staging or production.
        type: string
        required: true
      ref:
        description: The commit to deploy.
        type: string
        required: true
      all:
        description: Deploy every Worker, whatever changed (a first deploy, or a rollback).
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # wrangler's --env: staging's `[env.staging]` blocks; production is the top-level config.
  WRANGLER_ENV: ${{ inputs.environment == 'staging' && 'staging' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The environment's gate, once per deploy: production's required reviewers, if it has any, approve
    # here. GitHub records a deployment against it too, of the workflow's commit (task `deploy`); that
    # is not the deploy record, which the record job writes once every Worker is up.
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: read
    outputs:
      tier0: ${{ steps.plan.outputs.deploys0 }}
      tier1: ${{ steps.plan.outputs.deploys1 }}
      tier2: ${{ steps.plan.outputs.deploys2 }}
      groups0: ${{ steps.plan.outputs.groups0 }}
      groups1: ${{ steps.plan.outputs.groups1 }}
      groups2: ${{ steps.plan.outputs.groups2 }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The plan's outputs are this workflow's contract, so it runs this workflow's own scripts (from
      # github.workflow_sha) over the commit being deployed. Run from that commit instead, a deploy of a
      # commit older than a change to both planned no groups and failed (2026-11-04). Unpacked outside the
      # checkout, so they don't count as a change to it.
      - name: Unpack this workflow's scripts
        id: scripts
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          scripts="${RUNNER_TEMP}/workflow-scripts"
          mkdir -p "${scripts}"
          git cat-file -e "${WORKFLOW_SHA}^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "${WORKFLOW_SHA}"
          git archive "${WORKFLOW_SHA}" .github/scripts | tar -x -C "${scripts}"
          echo "dir=${scripts}/.github/scripts" >> "${GITHUB_OUTPUT}"

      # The commit this environment last deployed (its record, or the old tag before the first one).
      # With none, with `all`, or when it isn't an ancestor of the commit being deployed (a rollback),
      # every Worker deploys. A record that can't be read stops the deploy here.
      - name: Find the last deploy
        id: base
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ALL: ${{ inputs.all }}
          SCRIPTS: ${{ steps.scripts.outputs.dir }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(node "${SCRIPTS}/deploy-record.mjs" read "${ENVIRONMENT}")"
          if [ "${ALL}" = 'true' ] || [ -z "${base}" ] || ! git merge-base --is-ancestor "${base}" HEAD; then
            echo "[deploy] ${ENVIRONMENT} last deployed ${base:-nothing}; deploying every Worker"
            base=''
          else
            echo "[deploy] ${ENVIRONMENT} last deployed ${base}; deploying what changed since"
          fi
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"

      - name: Plan
        id: plan
        env:
          PLAN_MODE: deploy
          BASE: ${{ steps.base.outputs.sha }}
          HEAD: ${{ inputs.ref }}
          SCRIPTS: ${{ steps.scripts.outputs.dir }}
        run: node "${SCRIPTS}/ci-plan.mjs" > /dev/null

  tier0:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.groups0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups0) }}
    uses: ./.github/workflows/deploy-group.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      workers: ${{ needs.plan.outputs.tier0 }}
      group: ${{ matrix.group }}
      label: ${{ matrix.label }}
      history: ${{ matrix.history }}
      timeout: ${{ matrix.timeout }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  tier1:
    name: ${{ matrix.label }}
    needs: [plan, tier0]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.groups1 != '[]' &&
      (needs.tier0.result == 'success' || needs.tier0.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups1) }}
    uses: ./.github/workflows/deploy-group.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      workers: ${{ needs.plan.outputs.tier1 }}
      group: ${{ matrix.group }}
      label: ${{ matrix.label }}
      history: ${{ matrix.history }}
      timeout: ${{ matrix.timeout }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  tier2:
    name: ${{ matrix.label }}
    needs: [plan, tier0, tier1]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.groups2 != '[]' &&
      (needs.tier0.result == 'success' || needs.tier0.result == 'skipped') &&
      (needs.tier1.result == 'success' || needs.tier1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups2) }}
    uses: ./.github/workflows/deploy-group.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      workers: ${{ needs.plan.outputs.tier2 }}
      group: ${{ matrix.group }}
      label: ${{ matrix.label }}
      history: ${{ matrix.history }}
      timeout: ${{ matrix.timeout }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Every tier succeeded or had nothing to do: this environment now runs `ref`. Recorded as a
  # deployment, which never fails the run (deploy-record.mjs warns instead): the Workers are up.
  record:
    name: Record the deploy
    needs: [plan, tier0, tier1, tier2]
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out this workflow's scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Record the deployment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-record.mjs write "${ENVIRONMENT}" "${REF}"
