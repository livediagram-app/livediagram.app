name: Deploy apps

# The deploy itself, for ONE environment. Not triggerable on its own — both
# `deploy.yml` (production, manual) and `deploy-staging.yml` (staging,
# automatic on green CI) call it, so the two environments run byte-identical
# steps and cannot drift (spec/140). The only differences between them are
# this workflow's inputs and which secrets the caller hands over.
#
# Builds each app, then deploys to Cloudflare Workers in dependency order:
# marketing + live + telemetry + help + api in parallel → mcp (service
# binding to api) → router last (service bindings to the five path-routed
# workers).
on:
  workflow_call:
    inputs:
      wrangler_env:
        description: >-
          Wrangler environment name. Empty deploys the top-level config
          (production). "staging" deploys the `[env.staging]` blocks, which
          name every worker `-staging` and bind staging's own D1 / R2 / KV.
        type: string
        default: ''
      environment_name:
        description: GitHub environment recorded against the deployment.
        type: string
        required: true
      environment_url:
        description: Public URL the deployment is reachable at.
        type: string
        required: true
      ref:
        description: >-
          Commit to check out. Empty means the default branch. The staging
          caller passes the exact SHA CI went green on, because a
          `workflow_run` trigger otherwise checks out whatever `main` has
          moved to since.
        type: string
        default: ''
      mcp_origin:
        description: >-
          Baked into the live build as NEXT_PUBLIC_MCP_ORIGIN. Empty falls
          back to the hosted https://mcp.livediagram.app (see
          apps/live/lib/mcp-config.ts).
        type: string
        default: ''
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      # Each optional secret below is skipped when unset, so a fork that sets
      # none still deploys. The caller decides WHICH value it passes — the
      # staging caller hands over its `_STAGING` twin — so this workflow never
      # has to know which environment it is running for.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_JWKS_URL:
        required: false
      GUEST_ID_HMAC_SECRET:
        required: false
      INTERNAL_EVENTS_KEY:
        required: false

# Least privilege: deploys authenticate to Cloudflare with CF_API_TOKEN, which
# is a secret rather than a token permission, so no job here needs write access
# to the repository itself.
permissions:
  contents: read

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        # Frontend Clerk publishable key is baked into `next build`
        # at this step. Repo secret because the user doesn't want
        # the value in source even though it's publishable — set in
        # GitHub → Settings → Secrets → Actions. Unset is fine: the
        # ClerkProvider becomes a pass-through and the live app
        # runs in guest-only mode (see apps/live/lib/clerk-config.ts).
        # Staging passes its test tenant's `pk_test_*` key here, so a
        # staging sign-in can never touch a production user.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Turn on client-side telemetry emission (spec/22). A plain public
          # flag, not a secret. The api worker's TELEMETRY_ENABLED is the
          # authoritative gate; this just lets the live editor actually send
          # events. Unset (e.g. local builds, OSS forks) keeps emission off.
          # On in staging too, against staging's own D1 — that is how you
          # verify a new event actually lands before production sees it.
          NEXT_PUBLIC_TELEMETRY_ENABLED: 'true'
          # Show the "Continue with Google" OAuth button on the sign-in
          # / get-started pages. Plain public flag, not a secret. Only takes
          # effect when the Clerk key above is also set and Google SSO is
          # enabled in the Clerk dashboard (see apps/live/lib/clerk-config.ts
          # + spec/04).
          NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: 'true'
          # Which MCP host the live app points at. Empty in production (the
          # app's own default is the hosted one); staging passes
          # mcp-staging.livediagram.app so a staging OAuth flow stays inside
          # staging (spec/140).
          NEXT_PUBLIC_MCP_ORIGIN: ${{ inputs.mcp_origin }}
        run: pnpm build

      - name: Upload marketing build
        uses: actions/upload-artifact@v7
        with:
          name: marketing-out
          path: apps/marketing/out
          retention-days: 1

      - name: Upload live build
        uses: actions/upload-artifact@v7
        with:
          name: live-out
          path: apps/live/out
          retention-days: 1

      - name: Upload telemetry build
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-out
          path: apps/telemetry/out
          retention-days: 1

      - name: Upload help build
        uses: actions/upload-artifact@v7
        with:
          name: help-out
          path: apps/help/out
          retention-days: 1

  deploy-marketing:
    name: Deploy marketing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `${WRANGLER_ENV:+--env "$WRANGLER_ENV"}` below expands to nothing when
      # this is empty, so production runs the exact command it always ran.
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: marketing-out
          path: apps/marketing/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-telemetry:
    name: Deploy telemetry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: telemetry-out
          path: apps/telemetry/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-help:
    name: Deploy help
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: help-out
          path: apps/help/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/help
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-live:
    name: Deploy live
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: live-out
          path: apps/live/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-api:
    name: Deploy api
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context can't be read inside a step `if:`
    # (GitHub only allows env/github/needs/vars there), so lift the
    # Clerk JWKS URL into a job-level env var. The "Sync" step below
    # then gates on `env.CLERK_JWKS_URL` instead of the secret
    # directly. An empty/unset secret yields an empty env var, which
    # the `if:` treats as "skip" — same pure-guest fallback as before.
    env:
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      GUEST_ID_HMAC_SECRET: ${{ secrets.GUEST_ID_HMAC_SECRET }}
      INTERNAL_EVENTS_KEY: ${{ secrets.INTERNAL_EVENTS_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `whoami` prints which Cloudflare account the API token sees,
      # so when migrations fail with a 7403 "account not authorized"
      # the log shows immediately whether (a) the token doesn't have
      # D1 Edit scope, or (b) the token belongs to a different
      # account than CF_ACCOUNT_ID. Without this the error is too
      # generic to act on.
      - name: Verify Cloudflare token
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler whoami || true

      # Apply any pending D1 migrations before the worker code goes
      # live. Idempotent: wrangler tracks applied migrations in a
      # bookkeeping table and skips any it's already run. Has to
      # happen BEFORE the worker deploy so the new code doesn't
      # briefly run against a schema it doesn't understand.
      #
      # If a migration's bad, this step will fail and the deploy
      # halts before the worker is updated — that's the desired
      # safety: we'd rather block the deploy than break prod.
      #
      # This is also the step staging exists for: on the staging
      # caller it runs against `livediagram-staging`, so every merge
      # to main rehearses the migration against a real remote D1 one
      # deploy before it reaches the database holding real diagrams
      # (spec/140).
      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Database arg is the binding name (`DB`) — wrangler resolves
        # it via wrangler.toml, and `--env` decides WHICH database that
        # binding points at. Wrangler 4 auto-skips the confirmation
        # prompt in non-interactive CI environments, so no flag is
        # needed (the `--yes` flag from wrangler 3 was removed).
        # If this step fails, the most common cause is the CF_API_TOKEN
        # secret missing the D1: Edit permission on the account that
        # owns the database — but the `Verify Cloudflare token` step
        # above is the authoritative diagnostic.
        run: pnpm exec wrangler d1 migrations apply DB --remote ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # Push the Clerk JWKS URL as a worker secret so the
      # worker can verify tokens. Repo secret because the
      # user doesn't want the value in wrangler.toml. `wrangler
      # secret put` overwrites if the secret already exists, so this
      # step is idempotent — rotating the URL is just editing the
      # GitHub secret + re-running deploy. If the secret is empty
      # the api falls through to pure-guest mode (spec/04 + spec/11);
      # skipping the step entirely is safe but leaves an old value
      # in place, so this `if:` keeps the rotation story consistent.
      #
      # Worker secrets are per-environment, so the staging worker's
      # copy of this value never collides with production's.
      - name: Sync CLERK_JWKS_URL secret
        if: ${{ env.CLERK_JWKS_URL != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$CLERK_JWKS_URL" \
            | pnpm exec wrangler secret put CLERK_JWKS_URL ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # Same provisioning story for the guest-id HMAC secret (spec/04):
      # when present it makes /api/migrate require a signed guest id;
      # empty/unset leaves the worker on legacy unsigned migrate.
      - name: Sync GUEST_ID_HMAC_SECRET secret
        if: ${{ env.GUEST_ID_HMAC_SECRET != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$GUEST_ID_HMAC_SECRET" \
            | pnpm exec wrangler secret put GUEST_ID_HMAC_SECRET ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # INTERNAL_EVENTS_KEY (spec/22) has to hold the SAME value on the api and
      # mcp workers, and a mismatch is silent — the MCP's telemetry just lands
      # back in the throttled anonymous bucket with no error anywhere. Driving
      # both from one GitHub secret is what makes them agree by construction;
      # provisioning them by hand in two terminals is exactly how they drift.
      # Unset = both steps skip, which leaves whatever is already on the
      # workers (including a pair set by hand) untouched.
      - name: Sync INTERNAL_EVENTS_KEY secret
        if: ${{ env.INTERNAL_EVENTS_KEY != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$INTERNAL_EVENTS_KEY" \
            | pnpm exec wrangler secret put INTERNAL_EVENTS_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # The D1 binding's `database_id` placeholder in wrangler.toml
        # must be filled in before the first deploy succeeds. Run
        # `wrangler d1 create livediagram` locally once and commit the
        # resulting id — and again as `livediagram-staging` for the
        # staging environment (spec/140 "One-time setup"). Migrations
        # run via `pnpm db:migrate:remote` for ad-hoc local runs; the
        # deploy applies them automatically in the step above.
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-mcp:
    name: Deploy mcp
    # The MCP worker has a service binding to the api worker (spec/62), so api
    # must exist first. Not a router dependency — mcp.livediagram.app is its own
    # host, not a path under the main hostname.
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lifted to job level for the same reason as deploy-api's: the `secrets`
    # context isn't readable from a step `if:`.
    env:
      INTERNAL_EVENTS_KEY: ${{ secrets.INTERNAL_EVENTS_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The matching half of deploy-api's sync — same GitHub secret, so the two
      # workers can't disagree (spec/22). Skipped when unset, leaving whatever
      # is already on the worker in place.
      - name: Sync INTERNAL_EVENTS_KEY secret
        if: ${{ env.INTERNAL_EVENTS_KEY != '' }}
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$INTERNAL_EVENTS_KEY" \
            | pnpm exec wrangler secret put INTERNAL_EVENTS_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-router:
    name: Deploy router
    # Router has service bindings to all five path-routed workers, so they
    # must exist before it deploys.
    needs: [deploy-marketing, deploy-live, deploy-api, deploy-telemetry, deploy-help]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The router is what makes the hostname serve the new code, so it is the
    # one job that records the GitHub deployment. Putting it on all seven
    # would file seven deployments per run for one release. No protection
    # rules are implied — an environment with none behaves exactly as before;
    # it just gives the run a "View deployment" link, and somewhere to add an
    # approval gate later without touching this file.
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
