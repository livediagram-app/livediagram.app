name: E2E

# Each product's end-to-end suites (e2e-product.yml), for the products whose editor a change reaches
# (docs/ci.md): the same plan as CI, so a change to liveplanner alone never boots livediagram's stack.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push, to a pull request or to main, cancels the older run. A push to main
# plans against the last commit this workflow passed there, so a cancelled run's commits are still
# checked. A run started by hand gets a group of its own (docs/ci.md "Runs on main").
concurrency:
  group: e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read, to list this workflow's runs on main; write, to fail fast (docs/ci.md "Fail fast").
    permissions:
      contents: read
      actions: write
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A push to main plans against the last commit this workflow passed on main, so the commits of a
      # run a newer push cancelled are still checked (docs/ci.md "Runs on main").
      - name: Find main's base
        id: base
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW: e2e.yml
          HEAD: ${{ github.sha }}
        run: node .github/scripts/main-base.mjs

      # A pull request against its base; a push to main against the step above. A manual run has no
      # base and runs everything.
      - name: Plan
        id: plan
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event_name == 'push' && steps.base.outputs.base || '' }}
          HEAD: ${{ github.sha }}
        run: node .github/scripts/ci-plan.mjs

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels the rest of this commit's CI and E2E.
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  livediagram:
    name: livediagram
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.e2e), 'livediagram')
    # A called workflow gets at most what its caller grants: actions: write, to fail fast.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/e2e-product.yml
    with:
      product: livediagram
      editor: '@livediagram/editor'
      editor-dir: apps/editor
      sites: --filter @livediagram/help --filter @livediagram/community
      sites-cache: |
        apps/editor/.next/cache
        apps/help/.next/cache
        apps/community/.next/cache
        apps/marketing/.next/cache
      smoke-explorer: true
      signed-in-explorer: true
      signed-in-cache: editor-signed-in
      # Its smoke specs take about three minutes a shard on three: two would pass the 5-minute budget.
      smoke-shards: '[1, 2, 3]'

  liveplanner:
    name: liveplanner
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.e2e), 'liveplanner')
    # A called workflow gets at most what its caller grants: actions: write, to fail fast.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/e2e-product.yml
    with:
      product: liveplanner
      editor: '@liveplanner/editor'
      editor-dir: apps/editor
      sites: --filter @liveplanner/help
      sites-cache: |
        apps/editor/.next/cache
        apps/help/.next/cache
        apps/marketing/.next/cache
      smoke-explorer: true
      sites-explorer: true
      signed-in-explorer: true

  livedesign:
    name: livedesign
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.e2e), 'livedesign')
    # A called workflow gets at most what its caller grants: actions: write, to fail fast.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/e2e-product.yml
    with:
      product: livedesign
      editor: '@livedesign/live'
      editor-dir: apps/live
      sites: --filter @livedesign/help
      sites-cache: |
        apps/live/.next/cache
        apps/help/.next/cache
        apps/marketing/.next/cache
      smoke-explorer: true
      signed-in-explorer: true

  livedocuments:
    name: livedocuments
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.e2e), 'livedocuments')
    # A called workflow gets at most what its caller grants: actions: write, to fail fast.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/e2e-product.yml
    with:
      product: livedocuments
      editor: '@livedocuments/editor'
      editor-dir: apps/editor
      sites: --filter @livedocuments/help
      sites-cache: |
        apps/editor/.next/cache
        apps/help/.next/cache
        apps/marketing/.next/cache

  livehuddle:
    name: livehuddle
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.e2e), 'livehuddle')
    # A called workflow gets at most what its caller grants: actions: write, to fail fast.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/e2e-product.yml
    with:
      product: livehuddle
      editor: '@livehuddle/editor'
      editor-dir: apps/editor
      sites: --filter @livehuddle/help --filter @livehuddle/community
      sites-cache: |
        apps/editor/.next/cache
        apps/help/.next/cache
        apps/community/.next/cache
        apps/marketing/.next/cache
      smoke-explorer: true
      signed-in-explorer: true
      signed-in-cache: editor-signed-in

  # One check to require, whatever ran.
  e2e:
    name: E2E
    needs: [plan, livediagram, liveplanner, livedesign, livedocuments, livehuddle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
