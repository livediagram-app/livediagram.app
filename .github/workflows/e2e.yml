name: E2E Smoke

# Browser E2E (docs/specs/003-system-architecture/e2e-smoke.md "When it runs"): a per-PR merge gate.
# Every job is a required check on main; none needs a secret, so fork PRs run them too. The suite is
# spread over parallel jobs so the run stays within 5 minutes. A job renamed or a shard added here
# changes its check's name: update the main ruleset's required checks in the same change.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: checkout + a browser run, no writes back to the repo.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# These builds exist to be tested, and CI's required Checks job already type-checks every app, so
# `next build` skips its own type check here (@livediagram/next-config). Deploys keep it.
env:
  BUILD_SKIP_TYPECHECK: '1'

# Playwright's own image carries Chromium and every system library it needs, so no run downloads or
# apt-installs them. Its tag is the locked @playwright/test version; e2e-setup checks every job's tag.
# Host IPC: Chromium in a container otherwise runs on a 64 MB /dev/shm.
jobs:
  smoke:
    name: Smoke shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # Twice the 5-minute budget: a hung shard stops well before GitHub's six hours.
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    strategy:
      # Every shard reports, so one failing shard never hides another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/e2e-setup

      - name: Restore build cache
        uses: ./.github/actions/next-cache-restore
        with:
          name: live
          paths: apps/live/.next/cache

      # Built the way production builds it: a clean env with no NEXT_PUBLIC_API_BASE / Clerk keys,
      # so it calls same-origin `/api` (the e2e stack proxies it) and runs in guest mode. A build
      # id, so the stale build spec can make the server report a newer one
      # (docs/specs/016-platform/stale-builds.md).
      - name: Build live app
        env:
          NEXT_PUBLIC_BUILD_ID: e2e-build
        run: bash scripts/next-build-cold-retry.sh pnpm --filter @livediagram/live build

      # Playwright's webServer boots scripts/e2e-stack.mjs (api worker on local D1 + the static
      # serve). CI=1 makes it always start fresh.
      - name: Run smoke shard
        run: pnpm --filter @livediagram/live test:e2e:smoke --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Every shard builds the same thing: one of them saves it.
      - name: Save build cache
        if: matrix.shard == 1
        uses: ./.github/actions/next-cache-save

      # A failure, a flaky test that passed on retry, or a run cut off by the job timeout: each
      # leaves the trace of its failing attempt (retain-on-first-failure) in test-results, and a
      # finished run copies it into its report. always(): a timed-out job is cancelled, not failed.
      - name: Upload report with traces
        if: always() && hashFiles('apps/live/test-results/**/trace.zip', 'apps/live/playwright-report/data/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/live/playwright-report
            apps/live/test-results
          retention-days: 7

  sites:
    name: Sites audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/e2e-setup

      - name: Restore build cache
        uses: ./.github/actions/next-cache-restore
        with:
          name: sites
          paths: |
            apps/live/.next/cache
            apps/help/.next/cache
            apps/telemetry/.next/cache
            apps/community/.next/cache
            apps/marketing/.next/cache

      # The optical audit of the other sites needs their exports, and the stack serves help,
      # telemetry and the Community on the live origin, so live is built beside them. Marketing comes last, as turbo.json
      # orders it: its licences page runs Next's analyzer in every other app, on that app's Turbopack
      # cache, and beside the app's own build the two corrupt it (a SIGBUS mid-build).
      - name: Build live, help, telemetry and community
        env:
          NEXT_PUBLIC_BUILD_ID: e2e-build
        run: >-
          bash scripts/next-build-cold-retry.sh pnpm --filter @livediagram/live --filter @livediagram/help
          --filter @livediagram/telemetry --filter @livediagram/community build

      - name: Build marketing
        run: bash scripts/next-build-cold-retry.sh pnpm --filter @livediagram/marketing build

      - name: Run sites audit
        run: pnpm --filter @livediagram/live test:e2e:sites
      # The armed guest-signature specs (docs/specs/003-system-architecture/e2e-smoke.md "Armed guest
      # signatures") reuse this job's guest-mode build, on their own stack with enforcement on.
      - name: Run armed guest-signature specs
        if: always()
        run: pnpm --filter @livediagram/live test:e2e:armed

      - name: Save build cache
        uses: ./.github/actions/next-cache-save

      - name: Upload report with traces
        if: always() && hashFiles('apps/live/test-results*/**/trace.zip', 'apps/live/playwright-report*/data/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-sites
          path: |
            apps/live/playwright-report
            apps/live/test-results
            apps/live/playwright-report-armed
            apps/live/test-results-armed
          retention-days: 7

  signed-in:
    name: Signed-in specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/e2e-setup

      # The Clerk-stubbed build keeps its cache in the same directory as the guest build, under its
      # own name, so each restores what it built.
      - name: Restore build cache
        uses: ./.github/actions/next-cache-restore
        with:
          name: live-clerk-stub
          paths: apps/live/.next/cache

      # The signed-in specs (docs/specs/014-identity/blueprints/profile-picture.md) need Clerk ON, a
      # build-time switch, so they run against their own export with a stub key and a fake
      # window.Clerk; no Clerk account or secret is involved.
      - name: Build live app with Clerk stubbed
        run: bash scripts/next-build-cold-retry.sh pnpm --filter @livediagram/live build:clerk-stub

      - name: Run signed-in specs
        run: pnpm --filter @livediagram/live test:e2e:clerk-stub

      - name: Save build cache
        uses: ./.github/actions/next-cache-save

      - name: Upload report with traces
        if: always() && hashFiles('apps/live/test-results-clerk-stub/**/trace.zip', 'apps/live/playwright-report-clerk-stub/data/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-clerk-stub
          path: |
            apps/live/playwright-report-clerk-stub
            apps/live/test-results-clerk-stub
          retention-days: 7
