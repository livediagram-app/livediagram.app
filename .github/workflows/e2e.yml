name: E2E Smoke

# Browser E2E (docs/specs/003-system-architecture/e2e-smoke.md "When it runs"): a per-PR merge gate.
# Its job is a required check on main; it needs no secret, so fork PRs run it too.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: checkout + a browser run, no writes back to the repo.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    # Two builds (guest and Clerk-stubbed) and both suites take 13 to 16 minutes: 20 still stops a hung
    # run well before GitHub's six hours (docs/specs/003-system-architecture/e2e-smoke.md).
    timeout-minutes: 20
    # Playwright's own image carries Chromium and every system library it needs, so no run downloads
    # or apt-installs them. Its tag is the locked @playwright/test version; the first step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Host IPC: Chromium in a container otherwise runs on a 64 MB /dev/shm.
      options: --user 1001 --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The image's browsers belong to one Playwright version: a bump of @playwright/test without the
      # image tag would look for a Chromium the image doesn't have.
      - name: Check the image matches Playwright
        run: |
          locked="$(pnpm --filter @livediagram/live exec playwright --version | awk '{print $2}')"
          image="$(grep -o 'mcr.microsoft.com/playwright:v[0-9.]*' .github/workflows/e2e.yml | head -n 1)"
          echo "Playwright ${locked}, image ${image}"
          if [ "${image}" != "mcr.microsoft.com/playwright:v${locked}" ]; then
            echo "::error::Set the e2e.yml container image to v${locked}"
            exit 1
          fi

      # Build the live app the way production does — a clean env with no
      # NEXT_PUBLIC_API_BASE / Clerk keys, so it calls same-origin `/api`
      # (the e2e stack proxies it) and runs in guest mode.
      - name: Build live app
        # A build id, so the stale build spec can make the server report a newer one
        # (docs/specs/016-platform/stale-builds.md).
        env:
          NEXT_PUBLIC_BUILD_ID: e2e-build
        run: pnpm --filter @livediagram/live build

      # The optical-alignment audit also opens the help centre, the telemetry
      # dashboard and the marketing site; the e2e stack serves their exports.
      - name: Build help, telemetry and marketing
        run: pnpm --filter @livediagram/help --filter @livediagram/telemetry --filter @livediagram/marketing build

      # Playwright's webServer boots scripts/e2e-stack.mjs (api worker on
      # local D1 + the static serve). CI=1 makes it always start fresh.
      - name: Run smoke suite
        run: pnpm --filter @livediagram/live test:e2e

      # The signed-in specs (docs/specs/014-identity/blueprints/profile-picture.md) need Clerk ON,
      # a build-time switch, so they run against a second export with a stub key and a fake
      # window.Clerk; no Clerk account or secret is involved.
      - name: Build live app with Clerk stubbed
        run: pnpm --filter @livediagram/live build:clerk-stub

      - name: Run signed-in specs
        run: pnpm --filter @livediagram/live test:e2e:clerk-stub

      # A failure, a flaky test that passed on retry, or a run cut off by the job timeout: each leaves
      # the trace of its failing attempt (retain-on-first-failure) in its test-results folder, and a
      # finished run copies it into its report. always(): a timed-out job is cancelled, not failed.
      - name: Upload reports with traces
        if: always() && hashFiles('apps/live/test-results*/**/trace.zip', 'apps/live/playwright-report*/data/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/live/playwright-report
            apps/live/playwright-report-clerk-stub
            apps/live/test-results
            apps/live/test-results-clerk-stub
          retention-days: 7
