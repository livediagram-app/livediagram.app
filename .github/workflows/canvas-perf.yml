name: Canvas performance

# Each product's canvas performance probe, nightly against main (each product's
# docs/specs/008-canvas/canvas-performance.md "Measuring"): a reference board timed in a real browser,
# and over budget opens or updates that product's own issue ("Canvas performance budget: <product>").
# A night when main hasn't moved since the last successful run measures nothing.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: canvas-perf
  cancel-in-progress: false

jobs:
  probe:
    name: Reference board (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: livediagram
            editor: '@livediagram/editor'
            dir: livediagram/apps/editor
          - product: liveplanner
            editor: '@liveplanner/editor'
            dir: liveplanner/apps/editor
          - product: livedesign
            editor: '@livedesign/live'
            dir: livedesign/apps/live
          - product: livedocuments
            editor: '@livedocuments/editor'
            dir: livedocuments/apps/editor
          - product: livehuddle
            editor: '@livehuddle/editor'
            dir: livehuddle/apps/editor
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find the previous run
        id: previous
        working-directory: ${{ matrix.dir }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha="$(node ../../../packages/e2e-kit/src/perf/nightly.mjs previous)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${sha}" = "${GITHUB_SHA}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since ${sha}: nothing new to measure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        if: steps.previous.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Cache the pnpm store
        if: steps.previous.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.previous.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
        # onnxruntime-node's postinstall fetches CUDA binaries on Linux x64 from GitHub. Nothing in CI runs on a GPU,
        # and a 504 from that fetch failed whole runs on main (2026-11-08).
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Check the image matches Playwright
        if: steps.previous.outputs.skip != 'true'
        env:
          EDITOR: ${{ matrix.editor }}
        run: |
          locked="$(pnpm --filter "${EDITOR}" exec playwright --version | awk '{print $2}')"
          image="$(grep -o 'mcr.microsoft.com/playwright:v[0-9.]*' .github/workflows/canvas-perf.yml | head -n 1)"
          if [ "${image}" != "mcr.microsoft.com/playwright:v${locked}" ]; then
            echo "::error::Set the canvas-perf.yml container image to v${locked}"
            exit 1
          fi

      - name: Build editor app
        if: steps.previous.outputs.skip != 'true'
        run: pnpm --filter ${{ matrix.editor }} build

      - name: Run the probe
        if: steps.previous.outputs.skip != 'true'
        run: pnpm --filter ${{ matrix.editor }} perf:canvas

      # Reports whenever the canvas probe wrote its rows, even when another perf spec in the run failed: one broken
      # spec beside it (livedocuments' slide transitions, 2026-11-12) left the budget unreported for days. The job
      # still fails on that spec.
      - name: Report
        if: always() && steps.previous.outputs.skip != 'true' && hashFiles(format('{0}/test-results/perf/canvas-perf.json', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          PRODUCT: ${{ matrix.product }}
        # The run's I/O is @liveworkspace/e2e-kit's (packages/e2e-kit/src/perf/nightly.mjs), run from the editor's
        # folder so it reads that editor's test-results/perf.
        run: node ../../../packages/e2e-kit/src/perf/nightly.mjs report "${PRODUCT}"

      - name: Upload traces and screenshots
        if: always() && steps.previous.outputs.skip != 'true' && hashFiles(format('{0}/test-results/perf/**', matrix.dir)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: canvas-perf-${{ matrix.product }}
          path: ${{ matrix.dir }}/test-results/perf
          retention-days: 14
