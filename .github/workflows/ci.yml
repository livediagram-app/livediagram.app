name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out and verifies. It never writes
# to the repo, so the default token stays read-only rather than inheriting
# whatever the repository-wide default happens to be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three parallel jobs, so a PR waits for the slowest one rather than the sum.
# None needs another: only the apps build, and nothing depends on an app.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace runs its suite exactly once. Those with test:coverage run
      # it in the coverage step, so plain `test` skips them; the filters come
      # from the manifests (scripts/ci-test-filters.mjs), not a list kept here.
      # Two packages at a time: each vitest already fills the runner's cores,
      # and turbo's default fan-out starved the CPU-heavy sticky-vision suite
      # into timeouts.
      - name: Test
        run: |
          set -euo pipefail
          node scripts/ci-test-filters.mjs | xargs pnpm turbo run test --concurrency=2

      # Coverage runs as its own step because it ENFORCES something: the
      # per-file 100% thresholds on the api worker's identity / token /
      # share-link modules (apps/api/vitest.config.ts). Without this step the
      # thresholds are a local-only opinion, and the coverage tooling itself
      # goes unexercised in CI — which is how a v4 coverage provider once sat
      # against a v5 runner with every check green.
      - name: Coverage thresholds
        run: pnpm turbo run test:coverage --concurrency=2

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Resolve the staging wrangler configs without deploying anything
      # (docs/specs/016-platform/staging-environment.md). Wrangler does NOT inherit bindings into a named
      # environment, so a binding left out of an `[env.staging]` block is
      # simply absent from the staging worker, and a `service =` value that
      # lost its `-staging` suffix points the staging router at PRODUCTION.
      # Neither is a type error and neither shows up in a test — without this
      # step the first sign of either is a deploy. Covers the three workers
      # that carry bindings; the four static apps have nothing in their
      # staging block but an assets directory.
      - name: Staging config check
        run: pnpm staging:check
