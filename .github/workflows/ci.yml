name: CI

# The monorepo's CI (docs/ci.md): each product's CI from its own repository, run here for only what a
# change affects. A `plan` job asks Turborepo which workspaces the change reaches (the ones it touched
# and everything depending on them) and groups them by product; every later job runs per group, so a
# product the change never reached runs nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only checks out and verifies. The jobs that upload coverage add id-token: write,
# the OIDC token Codecov accepts in place of a secret, and every job that fails fast adds actions: write,
# to cancel the commit's other runs (docs/ci.md "Fail fast").
permissions:
  contents: read

# One run per branch: a newer push, to a pull request or to main, cancels the older run. A push to main
# plans against the last commit this workflow passed there, so a cancelled run's commits are still
# checked. A run started by hand gets a group of its own (docs/ci.md "Runs on main").
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read, to list this workflow's runs on main; write, to fail fast (docs/ci.md "Fail fast").
    permissions:
      contents: read
      actions: write
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      editors: ${{ steps.plan.outputs.editors }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      # The whole history, so turbo can diff against the base commit.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A push to main plans against the last commit this workflow passed on main, so the commits of a
      # run a newer push cancelled are still checked (docs/ci.md "Runs on main").
      - name: Find main's base
        id: base
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW: ci.yml
          HEAD: ${{ github.sha }}
        run: node .github/scripts/main-base.mjs

      # A pull request against its base; a push to main against the step above. A manual run has no
      # base and runs everything.
      - name: Plan
        id: plan
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event_name == 'push' && steps.base.outputs.base || '' }}
          HEAD: ${{ github.sha }}
        run: node .github/scripts/ci-plan.mjs

      # How far livehuddle's copy of livediagram has drifted (docs/ci.md "Drift report"), in the job
      # summary. Information only: it never fails the run.
      - name: Drift report
        continue-on-error: true
        timeout-minutes: 1
        run: node .github/scripts/drift-report.mjs

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels this commit's other workflow (CI or E2E).
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  checks:
    name: Checks (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      # The history, so the format check can diff against the base.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up
        uses: ./.github/actions/setup

      - name: Restore turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          name: checks-${{ matrix.group }}

      - name: Lint and type check
        run: pnpm turbo run lint typecheck --continue --concurrency=2 ${{ matrix.filters }}

      # CI's own scripts (.github/scripts), on the platform's run.
      - name: CI script tests
        if: matrix.group == 'platform'
        run: node --test .github/scripts/*.test.mjs

      # The files the change touched, each product's with its own ignore file (format-check.sh).
      - name: Format check
        env:
          BASE: ${{ matrix.base }}
          PRODUCT: ${{ matrix.format }}
        run: bash .github/scripts/format-check.sh

      # No new wall-clock speed budget in a test (docs/ci.md "Speed budgets"): CPU time only.
      - name: Speed budgets use CPU time
        env:
          BASE: ${{ matrix.base }}
          PRODUCT: ${{ matrix.format }}
        run: node .github/scripts/cpu-budget-guard.mjs

      # No new source file copied across products (docs/ci.md "Copies across products"). Repo-wide and
      # under a second, so every group runs it.
      - name: No new copies across products
        run: node .github/scripts/duplicate-guard.mjs

      # No source file grows past 800 lines (docs/ci.md "File size"), outside the shrink-only baseline.
      # Repo-wide and under a second, so every group runs it.
      - name: No new files over 800 lines
        run: node .github/scripts/file-size-guard.mjs

      - name: Save turbo cache
        uses: ./.github/actions/turbo-cache-save

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels this commit's other workflow (CI or E2E).
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  tests:
    name: Tests (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Restore turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          name: tests-${{ matrix.group }}

      # Every workspace runs its suite once: those with test:coverage run that (it enforces their
      # per-file thresholds, so the coverage tooling itself is exercised), the rest plain `test`. The
      # product's editor runs in the sharded job below. Two at a time: each vitest fills the cores.
      - name: Test
        if: matrix.plain != ''
        run: pnpm turbo run test --continue --concurrency=2 ${{ matrix.plain }}

      - name: Coverage thresholds
        if: matrix.coverage != ''
        run: pnpm turbo run test:coverage --continue --concurrency=2 ${{ matrix.coverage }}

      # A Codecov outage must not hold back a merge: the upload logs its error and the job passes.
      - name: Upload coverage
        if: matrix.coverage != ''
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.group }}
          fail_ci_if_error: false

      # Listed by find, which prunes node_modules: upload-artifact's own `**` glob follows pnpm's symlinks
      # through every node_modules (tens of millions of paths; an exclusion filters but never prunes), and
      # ran past the job's timeout.
      - name: List the coverage files
        id: lcov
        if: matrix.coverage != ''
        run: |
          {
            echo 'paths<<LCOV_PATHS'
            find . -name node_modules -prune -o -path '*/coverage/lcov.info' -print
            echo 'LCOV_PATHS'
          } >> "$GITHUB_OUTPUT"

      # The lcov files the coverage report reads (docs/ci.md "Coverage report"): a pull request's for its
      # report, main's as the base the next pull requests compare with, so kept 30 days.
      - name: Keep the coverage for the report
        if: matrix.coverage != '' && steps.lcov.outputs.paths != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.group }}-tests
          path: ${{ steps.lcov.outputs.paths }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Save turbo cache
        uses: ./.github/actions/turbo-cache-save

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels this commit's other workflow (CI or E2E).
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  editor-tests:
    name: Editor unit tests (${{ matrix.group }}) ${{ matrix.shard }}/${{ matrix.total }}
    needs: plan
    if: needs.plan.outputs.editors != '[]' && needs.plan.outputs.editors != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      # Every shard reports, so one failing shard never hides another's failures.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.editors) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm --filter ${{ matrix.editor }} exec vitest run --coverage --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.group }}-editor
          files: ${{ matrix.dir }}/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Keep the coverage for the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.group }}-editor-${{ matrix.shard }}
          path: ${{ matrix.dir }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 30

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels this commit's other workflow (CI or E2E).
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  build:
    name: Build (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      # The affected workspaces with a build, and whatever they build on. Every turbo run here takes
      # --continue, so one failing workspace never hides another's failure.
      - name: Build
        run: pnpm turbo run build --continue ${{ matrix.filters }}

      # The CLI as npm would publish it: its file list and size, without publishing.
      - name: CLI package dry run
        if: matrix.cli != ''
        working-directory: ${{ matrix.cli }}/dist
        run: npm pack --dry-run

      # Resolve the staging wrangler configs without deploying anything: a binding left out of an
      # `[env.staging]` block, or a `service =` that lost its `-staging` suffix, shows up here
      # rather than at a deploy.
      - name: Staging config check
        run: pnpm turbo run staging:check --continue ${{ matrix.filters }}

      # Fail fast (docs/ci.md "Fail fast"): a red job cancels this commit's other workflow (CI or E2E).
      - name: Cancel on failure
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/cancel-on-failure

  # The pull request's coverage report, in its description (docs/ci.md "Coverage report"): patch coverage
  # and each reached product against main, from the lcov files the jobs above kept. Informational: it is
  # not part of the CI check, and a failure here never fails a pull request.
  coverage-report:
    name: Coverage report
    needs: [plan, tests, editor-tests]
    if: >-
      always() && github.event_name == 'pull_request' && needs.tests.result == 'success' &&
      needs.editor-tests.result != 'failure' && needs.editor-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # The history, for the diff against the base.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download this run's coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-head

      # The run tested the merge commit (HEAD here), so the diff runs to it: its line numbers are the
      # lcov files' own.
      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: HEAD
          HEAD_DIR: coverage-head
        run: |
          mkdir -p coverage-head
          node .github/scripts/coverage-report.mjs

  # One check to require on main, whatever ran: it fails when any job above failed or was cancelled,
  # and passes when the change reached nothing.
  ci:
    name: CI
    needs: [plan, checks, tests, editor-tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
