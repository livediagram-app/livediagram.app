name: CodeQL

# Advanced setup: one job scans every language, so CodeQL shows as a single
# check instead of one per language. Requires the repository's CodeQL default
# setup to be disabled, otherwise GitHub rejects the upload.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly released queries also run against an unchanged main.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push, to a pull request or to main, cancels the older run. A run
# started by hand gets a group of its own (docs/ci.md "Runs on main").
concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # The livehuddle fork (#1192) nearly doubled the code to scan: a full analysis now takes 21 to
    # over 30 minutes, so 30 cancelled runs on main and on PRs alike (docs/ci.md).
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions, javascript-typescript
          build-mode: none
          # Leaves test code out (the file says why).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@v4
