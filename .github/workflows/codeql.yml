name: CodeQL

# Advanced setup: one job scans every language, so CodeQL shows as a single
# check instead of one per language. Requires the repository's CodeQL default
# setup to be disabled, otherwise GitHub rejects the upload.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly released queries also run against an unchanged main.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. On main every commit runs to the end, in a
# group of its own: a shared group keeps only one pending run, so a burst of merges would still drop
# the middle ones (livediagram/docs/specs/016-platform/deployment.md "Runs on main are never cancelled").
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Large PRs (the Community series) need more than 20 minutes to analyse.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions, javascript-typescript
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
