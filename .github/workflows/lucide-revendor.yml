name: Lucide re-vendor

# A Dependabot bump of lucide-static leaves the vendored glyphs and the manifest's pin behind, which
# packages/icons' tests fail on (docs/specs/004-interface-design/iconography.md). This regenerates
# them and commits to the pull request. A commit pushed with GITHUB_TOKEN starts no pull_request
# run, so it then dispatches CI and E2E Smoke on that commit for the required checks.
on:
  pull_request:
    paths:
      - packages/icons/package.json

permissions:
  contents: write # push the regenerated files to the Dependabot branch
  actions: write # dispatch ci.yml and e2e.yml on that commit

concurrency:
  group: lucide-revendor-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  revendor:
    name: Re-vendor Lucide
    # Dependabot's own branches only; never a fork, never a person's branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-vendor
        run: pnpm --filter @livediagram/icons vendor:lucide --adopt-installed

      - name: Commit and dispatch the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/icons; then
            echo "lucide-revendor: the vendored glyphs already match the installed lucide-static"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/icons/lucide-manifest.json packages/icons/src/lucide.generated.ts
          git commit -m 'Re-vendor Lucide for the bumped lucide-static'
          git push origin "HEAD:${BRANCH}"
          echo "lucide-revendor: pushed $(git rev-parse --short HEAD) to ${BRANCH}"
          gh workflow run ci.yml --ref "${BRANCH}"
          gh workflow run e2e.yml --ref "${BRANCH}"
          echo "lucide-revendor: dispatched CI and E2E Smoke on ${BRANCH}"
