name: Lucide re-vendor

# A Dependabot bump of lucide-static leaves the vendored glyphs and the manifest's pin behind, which
# packages/icons' tests fail on (each product's docs/specs/004-interface-design/iconography.md). This regenerates
# them and commits to the pull request. GitHub holds the pull_request runs a bot's push starts
# (action_required), and only pull_request runs count as the PR's required checks, so it approves them.
#
# Two jobs, so the dependency tree never runs beside a write token. The first installs (with no install
# scripts) and regenerates under a read-only token, and hands over only a patch of the two generated files.
# The second installs nothing: it applies that patch, and only its last step holds the token that pushes and
# approves.
on:
  pull_request:
    paths:
      - packages/icons/package.json

permissions:
  contents: read

concurrency:
  group: lucide-revendor-${{ github.head_ref }}
  # Queued, not cancelled: this workflow approves its own held run, which must not cancel the approver.
  cancel-in-progress: false

jobs:
  revendor:
    name: Re-vendor Lucide
    # Dependabot's own branches only; never a fork, never a person's branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # No install scripts: the re-vendor reads lucide-static's files and builds nothing.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Re-vendor
        run: pnpm --filter @liveworkspace/icons vendor:lucide --adopt-installed

      - name: Diff the generated files
        id: diff
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --binary -- packages/icons/lucide-manifest.json packages/icons/src/lucide.generated.ts > revendor.patch
          if [ -s revendor.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lucide-revendor: the vendored glyphs already match the installed lucide-static"
          fi

      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lucide-revendor-patch
          path: revendor.patch
          retention-days: 1

  commit:
    name: Commit and approve the checks
    needs: revendor
    if: needs.revendor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the regenerated files to the Dependabot branch
      actions: write # approve the pull_request runs that commit starts
    steps:
      - name: Check out the re-vendored commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.revendor.outputs.sha }}
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: lucide-revendor-patch
          path: ${{ runner.temp }}/lucide-revendor

      - name: Apply the patch
        env:
          PATCH: ${{ runner.temp }}/lucide-revendor/revendor.patch
        run: |
          set -euo pipefail
          # Only the two generated files, nothing else, whatever the first job produced.
          touched="$(git apply --numstat "${PATCH}" | cut -f3 | sort)"
          allowed="$(printf '%s\n' packages/icons/lucide-manifest.json packages/icons/src/lucide.generated.ts | sort)"
          for file in ${touched}; do
            if ! printf '%s\n' "${allowed}" | grep -qxF "${file}"; then
              echo "::error::lucide-revendor: the patch touches ${file}, which is not a generated Lucide file"
              exit 1
            fi
          done
          git apply "${PATCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/icons/lucide-manifest.json packages/icons/src/lucide.generated.ts
          git commit -m 'Re-vendor Lucide for the bumped lucide-static'

      - name: Push and approve the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # The token reaches git for this one push only, never the checkout's saved config.
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          echo "lucide-revendor: pushed $(git rev-parse --short HEAD) to ${BRANCH}"
          sha="$(git rev-parse HEAD)"
          # The held runs appear within seconds of the push; CI and E2E are required.
          approved=''
          for attempt in $(seq 1 24); do
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&status=action_required" -q '.workflow_runs[].id'); do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" > /dev/null
              name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" -q .name)"
              echo "lucide-revendor: approved ${name} (run ${id})"
              approved="${approved}|${name}|"
            done
            missing=''
            for required in 'CI' 'E2E'; do
              case "${approved}" in *"|${required}|"*) ;; *) missing="${missing} ${required};" ;; esac
            done
            [ -z "${missing}" ] && exit 0
            sleep 5
          done
          echo "::error::lucide-revendor: no held run to approve for${missing} on ${sha}; approve it in the Actions tab"
          exit 1
