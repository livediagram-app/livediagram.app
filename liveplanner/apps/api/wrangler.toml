name = "liveplanner-api"
# The liveworkspace Cloudflare account, which also hosts liveplanner.app, so a deploy can never land on another one.
account_id = "851be7d244b76a6557bcbe6c4ded80f5"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Local dev port, off wrangler's 8787 default so a liveplanner stack runs beside
# a livediagram one (the router's API_ORIGIN and the docs name the same port).
[dev]
port = 8887

# Bundle the share card's fonts (packages/render-png/fonts, Inter Regular and Bold) as raw bytes for the resvg PNG
# renderer (docs/specs/013-workspace/share-link-previews.md): a Worker has no system fonts, so without this the card
# draws shapes but no text. Inheritable, so staging takes it too.
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

# Plain (non-secret) vars. Everything here is every fork's default too, so
# what only liveplanner.app runs with is NOT here: TELEMETRY_ENABLED lives in
# `hosted-vars.json`, which the deploy workflow adds
# with `wrangler deploy --var` on liveplanner.app's own repository only, and
# then verifies on the editor worker (docs/specs/016-platform/deployment.md
# "Hosted profile"). A fork is therefore telemetry-off until it
# opts in, by declaring the var here. TELEMETRY_ENABLED gates this worker's
# anonymous, first-party product events, sent to liveworkspace's central
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/telemetry.md):
# "true" turns it on; anything else, or absent, keeps it fully off. The
# service's URL is TELEMETRY_URL, also from the hosted profile (per
# environment, mirrored into the frontends as NEXT_PUBLIC_TELEMETRY_URL);
# unset means production's (https://liveworkspace.app/api/telemetry). Locally,
# `TELEMETRY_URL=http://localhost:8790/api/telemetry` in .dev.vars.
[vars]

# Guest signature enforcement (docs/specs/015-api/public-api-and-tokens.md §4). Stated here,
# never only in the dashboard: every `wrangler deploy` replaces the worker's
# plain vars with the ones this file declares, so a dashboard-only value is
# silently wiped by the next deploy.
#
# GUEST_SIGNING_LIVE_AT: when production started signing guest ids. The
# GUEST_ID_HMAC_SECRET sync shipped with the deploy that started
# 2026-09-25T12:00:41Z, and the first signed upgrade landed at 12:03:44Z, so
# 12:00:00Z is the latest instant at which every existing id was unsigned. An id
# whose participant row is older may still run its one-time upgrade unsigned.
#
# GUEST_SIG_ENFORCE_AFTER: from this instant, owner-scoped routes, the room's
# owner leg and the legacy upgrade require a valid guest signature. Blank: not
# armed. Every entry path now resolves a signed id before its first api call,
# and every e2e stack runs with enforcement on (scripts/e2e-stack.mjs), so a
# regression fails the suite; re-arming production is Tom's or Webber's call
# (docs/specs/015-api/public-api-and-tokens.md §6).
# `pnpm dev` keeps it blank (apps/api/package.json): a developer's local guests
# can predate their local signing secret and would be locked out of their own
# test data.
GUEST_SIGNING_LIVE_AT = "1790337600000"
GUEST_SIG_ENFORCE_AFTER = ""

# The CLI signs in through the MCP worker's OAuth server (docs/specs/015-api/cli.md "Authentication"); the
# api names it in /api/capabilities. CLI_MIN_VERSION (unset until a release needs a floor) refuses writes
# from an older CLI.
OAUTH_ISSUER = "https://mcp.liveplanner.app"

# D1 database holding projects + participants. The local binding name
# (`DB`) is what `src/db.ts` reads via the Env type. The `database_name`
# is the Cloudflare-side name (must be created via `wrangler d1 create
# liveplanner` or the dashboard). `database_id` is filled in after the
# database is created on the liveplanner Cloudflare account. The id below is a
# placeholder (all zeros), so a deploy fails loudly until the real one is pasted;
# `wrangler dev` runs against a local SQLite file and does not care.
[[d1_databases]]
binding = "DB"
database_name = "liveplanner"
database_id = "8c7e45fd-6a13-42f4-bd59-fd115fdc3087"
migrations_dir = "migrations"

# R2 bucket caching each project's SVG snapshot (`thumb/<id>`, the Explorer thumbnail and
# live image) and share card (docs/specs/006-project/project-snapshots.md). The binding
# name `SNAPSHOTS` is what `src/types.ts` reads via the Env type. The bucket must be created
# out of band via `wrangler r2 bucket create liveplanner-snapshots` (production) or the
# dashboard. Leaving the binding absent locally only turns the snapshot doors off: they
# answer 404 and the Explorer row keeps its icon.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "liveplanner-snapshots"

# Per-owner rate limiter (Cloudflare Workers Rate Limiting API).
# Caps writes at 300 / 60s per owner: a generous ceiling for normal
# editing (autosave + comment posts + log appends) but well below
# what a malicious bot would push through. The api worker calls
# `env.WRITE_RATE_LIMITER.limit({ key })` at the top of every write
# endpoint; over-limit requests get a 429. Namespace ids are
# arbitrary local identifiers (Cloudflare scopes by binding name +
# script). When this binding is absent the rate-limit
# helper falls through to "allow" so deployments without the
# feature still work.
[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Per-IP limiter for the CLI's telemetry relay (POST /api/events,
# docs/specs/017-telemetry/telemetry.md "The relay"). Separate namespace from the write limiter so abuse of
# the public relay can never eat into a user's project-write budget. Keyed on
# CF-Connecting-IP in src/routes/events.ts. Absent binding → the helper allows.
[[unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The plan's Durable Object (docs/specs/015-api/api.md "Storage"): one SQLite-backed instance per plan id,
# holding the plan's content (tabs, items, sheets, changesets) in its own SQLite and running its realtime
# room (presence + ordered ops over hibernating WebSockets).
[[durable_objects.bindings]]
name = "PLAN_ROOM"
class_name = "PlanRoom"

# liveplanner has never been deployed, so the class starts SQLite-backed with no rename history.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanRoom"]

# Scheduled jobs the worker handles via the `scheduled` export. One
# entry per cron; each fires the same handler with `event.cron` set
# to the matching pattern so the body can dispatch.
#
# `0 3 * * *`: daily at 03:00 UTC. Fires independent retention sweeps
# on this trigger (telemetry's retention is liveworkspace's, liveworkspace/docs/telemetry.md).
# Plus the docs/specs/014-identity/transactional-email.md lifecycle onboarding emails, a no-op when
# RESEND_API_KEY is unset.
#
# `*/5 * * * *`: every five minutes, follow liveworkspace's teams change feed into this app's copy
# and mark tokens revoked on liveworkspace.app (liveworkspace/docs/accounts.md "How an app keeps up").
[triggers]
crons = ["0 3 * * *", "*/5 * * * *"]

# Per-IP limiter for share-code resolution (GET /api/share/<code>). That
# read carries the optional share password and is otherwise unauthed +
# exempt from the write limiter, so without this an attacker holding a
# code could brute-force the password unbounded. 30 resolves / 60s per IP
# is ample for legit visitors. Separate namespace. Absent binding → the
# index.ts check is skipped, so a deployment without it still works.
[[unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-IP throttle for GET /api/unfurl (docs/specs/009-elements/link-cards.md): an unauthenticated outbound
# page fetch for link-card previews. 60/60s is plenty for a user dropping
# bookmark cards. Separate namespace. Absent binding → check skipped (a deployment without it).
[[unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# Per-token read throttle for token-authed GETs (docs/specs/015-api/public-api-and-tokens.md §3.5): an external
# integration's reads, keyed on the token id, so one runaway script can't hammer
# reads independently of the owner's app use. Token WRITES ride
# WRITE_RATE_LIMITER (also keyed on the token id). Absent binding → allow.
[[unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# Per-owner limiter for Explorer Home's reads (GET /api/home and /api/home/timeline,
# docs/specs/013-workspace/explorer-home.md): one read answers a whole screen, and a healthy client
# reads on mount, on return to the tab and after its own writes, a handful a minute. 60 / 60s bounds a
# looping client. Separate namespace. Absent binding → allow (a deployment without it).
[[unsafe.bindings]]
name = "HOME_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 60, period = 60 }

# Per-token limiter for workbench ticket mints and pairing requests (docs/specs/013-workspace/workbench-embeds.md,
# WORKBENCH_TICKETS_PER_MINUTE), keyed workbench-ticket:<token id>. A workbench opens a few projects, never a stream.
# Separate namespace. Absent binding → allow (a deployment without it).
[[unsafe.bindings]]
name = "WORKBENCH_TICKET_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1010"
simple = { limit = 30, period = 60 }

# Per-network limiter for a form link's reads and responses (docs/specs/030-forms/forms.md "Abuse and limits"),
# keyed form:<network> and form-read:<network> (an IPv4 /24 or IPv6 /56, client-ip.ts clientNetwork). Respondents are anonymous,
# so the owner-keyed write limiter would put them all on one key. 60 / 60s lets a classroom behind one address
# answer together. Separate namespace. Absent binding → allow (a deployment without it).
[[unsafe.bindings]]
name = "FORM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1011"
simple = { limit = 60, period = 60 }

# Per-network limiter for an invite email's Decline link (docs/specs/013-workspace/teams.md "Declining from the
# email"): GET and POST /api/teams/invite-decline/<token>, keyed invite-decline:<network> (an IPv4 /24 or IPv6 /56).
# Open doors, so the owner-keyed write limiter would put every caller on one key. 20 / 60s is far above one
# person declining. Separate namespace. Absent binding → allow (a deployment without it).
[[unsafe.bindings]]
name = "TEAM_INVITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1012"
simple = { limit = 20, period = 60 }

# RESEND_API_KEY + RESEND_FROM + APP_BASE_URL drive transactional &
# lifecycle email (docs/specs/014-identity/transactional-email.md). All optional; an absent RESEND_API_KEY makes
# the whole email feature inert — no sends, and the email_lifecycle table
# is never touched, so a deployment with email off does zero extra work:
#
#   - RESEND_API_KEY: worker secret. Local dev: drop
#     `RESEND_API_KEY=re_...` into `apps/api/.dev.vars` (gitignored).
#     Production: `wrangler secret put RESEND_API_KEY`.
#   - RESEND_FROM: optional [vars] From identity, e.g.
#     "liveplanner <hello@liveplanner.app>" (the default). The domain
#     must be verified in Resend.
#   - APP_BASE_URL: optional [vars] public origin for links in emails.
#     Defaults to "https://liveplanner.app".

# Sign-in (docs/specs/014-identity/auth-and-guest-access.md) goes through the
# liveworkspace accounts Worker. Four values, provisioned out-of-band so none
# lands in the repo (docs/specs/002-project-scope/secrets-policy.md):
#
#   ACCOUNTS_URL            the accounts Worker's origin
#                           (https://liveworkspace.app)
#   API_RESOURCE            this API's registered resource, the access
#                           token's audience (https://liveplanner.app/api)
#   ACCOUNTS_CLIENT_ID      this app's OAuth client id
#   ACCOUNTS_CLIENT_SECRET  its client secret (the only real secret)
#
#   - Local dev: put them in `apps/api/.dev.vars` (gitignored), plus
#     AUTH_ORIGIN=http://localhost:3200 so the callback comes back
#     through the router. Wrangler reads it on the next `wrangler dev`.
#   - Production: Cloudflare Worker secrets. The deploy workflow pulls
#     each from the GitHub repo secret of the same name and pipes it into
#     `wrangler secret put` on every deploy, so a value rotates by
#     editing the GitHub secret. Secrets persist across deploys
#     independently of this file.
#
# With ACCOUNTS_URL or API_RESOURCE unset the api worker stays in
# pure-guest mode and trusts `X-Owner-Id` exclusively
# (docs/specs/014-identity/auth-and-guest-access.md + docs/specs/015-api/api.md).
# The client id and secret come from registering liveplanner with the
# accounts Worker (liveworkspace/docs/integrating-an-app.md).
#
# GUEST_ID_HMAC_SECRET is provisioned the same way (`.dev.vars` locally,
# `wrangler secret put GUEST_ID_HMAC_SECRET` + a matching GitHub repo
# secret in prod; never in [vars] — it's secret material). When set, the
# worker mints signed guest ids and /api/migrate requires a valid
# signature, closing the "observe a guest id, claim its data" hole
# (docs/specs/014-identity/auth-and-guest-access.md). Generate with `openssl rand -hex 32`. Unset = legacy unsigned
# migrate (pure-guest / single-user deployment).

# TELEMETRY_KEY is liveplanner's Worker key for liveworkspace's central
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/telemetry.md), sent as
# X-Telemetry-Key: a Worker sends no Origin, so the key is what lets its posts
# speak for liveplanner.app. Secret material, provisioned out-of-band like the
# two above; never in [vars]:
#
#   - Local dev: `TELEMETRY_KEY=dev-liveplanner-key` in `apps/api/.dev.vars`
#     (gitignored), matching the service's .dev.vars.
#   - Production: `wrangler secret put TELEMETRY_KEY` here and on the mcp
#     worker, the SAME value as the service's TELEMETRY_KEY_LIVEPLANNER.
#     Generate with `openssl rand -hex 32`.
#
# Unset = this worker sends no telemetry, so a deployment can ignore it.


# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `liveplanner-api-staging` via
# `wrangler deploy --env staging`.
#
# Everything below is restated ON PURPOSE. Wrangler does NOT inherit
# bindings into a named environment: `vars`, `d1_databases`, `r2_buckets`,
# `durable_objects`, `migrations` and `unsafe` are all non-inheritable, so a
# block omitted here is a binding MISSING from the deployed staging worker,
# with no warning. Only `main`, `compatibility_date`, `rules` and `triggers`
# carry over from the production config above.
#
# The values that genuinely differ from production are the D1 database, the
# R2 snapshot bucket, and the email vars that name the public origin. Everything
# else agreeing with production is the point: staging is a rehearsal.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "liveplanner-api-staging"

# TELEMETRY_ENABLED comes from `hosted-vars.json`, exactly as
# for production (see the top of this file), and so does TELEMETRY_URL: staging's
# events go to staging's telemetry service, never into production's published numbers.
[env.staging.vars]
# APP_BASE_URL comes from `hosted-vars.json` per environment, so staging's email and workbench links point
# back at staging (docs/specs/014-identity/transactional-email.md, docs/specs/013-workspace/workbench-embeds.md).
RESEND_FROM = "liveplanner staging <hello@liveplanner.app>"

# Guest signature enforcement, matching production (see the top-level [vars]).
# Staging's own database dates from 2026-09-17 and signs with its own secret;
# its test guests take the same dates rather than drift from production.
GUEST_SIGNING_LIVE_AT = "1790337600000"
GUEST_SIG_ENFORCE_AFTER = ""

# The staging MCP worker's OAuth server, for the CLI against staging.
OAUTH_ISSUER = "https://mcp-staging.liveplanner.app"

# Placeholder id: create the database on the liveplanner Cloudflare account and paste its id.
# applies the migrations in `migrations/` against it — which is the whole
# reason this environment exists (docs/specs/016-platform/staging-environment.md).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "liveplanner-staging"
database_id = "08c233ed-6c77-4bb9-9c4c-3462efac9496"
migrations_dir = "migrations"

# Own bucket: `wrangler r2 bucket create liveplanner-snapshots-staging`. Sharing
# production's would let staging overwrite or delete real snapshots.
[[env.staging.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "liveplanner-snapshots-staging"

# Rate limiters. Namespace ids deliberately MATCH production's: Cloudflare
# scopes a namespace per script, and `liveplanner-api-staging` is a different
# script, so these are already separate counters. Renumbering them would
# imply the number carries meaning across workers, which it doesn't.
[[env.staging.unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[env.staging.unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "HOME_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "WORKBENCH_TICKET_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1010"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "FORM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1011"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "TEAM_INVITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1012"
simple = { limit = 20, period = 60 }

# A different script is a different Durable Object namespace, so staging's
# PLAN_ROOM instances are separate from production's for free. The class
# still needs its own migration tag in this environment.
[[env.staging.durable_objects.bindings]]
name = "PLAN_ROOM"
class_name = "PlanRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PlanRoom"]

# The daily 03:00 UTC sweeps (retention + the docs/specs/014-identity/transactional-email.md email crons) run on
# staging too, against staging's own data. Restated rather than inherited so
# that reading this block tells you what the staging worker actually does.
[env.staging.triggers]
crons = ["0 3 * * *", "*/5 * * * *"]

# The four ACCOUNTS_* / API_RESOURCE values, GUEST_ID_HMAC_SECRET and
# TELEMETRY_KEY come from the
# `_STAGING` GitHub secrets via the deploy workflow. RESEND_API_KEY is provisioned by
# hand exactly as it is for production:
#   cd apps/api && wrangler secret put RESEND_API_KEY --env staging
# Worker secrets are per-environment, so staging's never collide with
# production's.
