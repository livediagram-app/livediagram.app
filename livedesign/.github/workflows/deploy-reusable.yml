name: Deploy (reusable)

# The deploy itself, for ONE environment. NOT triggerable on its own — it has
# no `workflow_dispatch`, so the Actions tab lists it with no Run button. Both
# `deploy.yml` (production, manual) and `deploy-staging.yml` (staging,
# automatic on green CI) call it, so the two environments run byte-identical
# steps and cannot drift (docs/specs/016-platform/staging-environment.md). The only differences between them are
# this workflow's inputs and which secrets the caller hands over.
#
# Builds each app, then deploys to Cloudflare Workers in dependency order:
# marketing + live + help + api in parallel → mcp
# (service binding to api) → router last (service bindings to the four
# path-routed workers). Telemetry is liveworkspace's (liveworkspace/docs/telemetry.md), not deployed here.
on:
  workflow_call:
    inputs:
      wrangler_env:
        description: >-
          Wrangler environment name. Empty deploys the top-level config
          (production). "staging" deploys the `[env.staging]` blocks, which
          name every worker `-staging` and bind staging's own R2 / KV.
        type: string
        default: ''
      environment_name:
        description: GitHub environment recorded against the deployment.
        type: string
        required: true
      environment_url:
        description: Public URL the deployment is reachable at.
        type: string
        required: true
      ref:
        description: >-
          Commit to check out. Empty means the default branch. The staging
          caller passes the exact SHA CI went green on, because a
          `workflow_run` trigger otherwise checks out whatever `main` has
          moved to since.
        type: string
        default: ''
      mcp_origin:
        description: >-
          Baked into the live build as NEXT_PUBLIC_MCP_ORIGIN. Empty falls
          back to the hosted https://mcp.livedesign.app (see
          apps/live/lib/mcp-config.ts).
        type: string
        default: ''
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      # Each optional secret below is skipped when unset, so a fork that sets
      # none still deploys. The caller decides WHICH value it passes — the
      # staging caller hands over its `_STAGING` twin — so this workflow never
      # has to know which environment it is running for.
      # Sign-in through the liveworkspace accounts Worker
      # (docs/specs/014-identity/auth-and-guest-access.md). All four, or the
      # deployment stays guest-only.
      ACCOUNTS_URL:
        required: false
      API_RESOURCE:
        required: false
      ACCOUNTS_CLIENT_ID:
        required: false
      ACCOUNTS_CLIENT_SECRET:
        required: false
      MEDIA_KEY:
        required: false
      TELEMETRY_KEY:
        required: false

# The hosted profile (docs/specs/016-platform/deployment.md "Hosted profile"):
# livedesign.app's own deploys add the vars in apps/api/hosted-vars.json
# (telemetry on, per-owner image caps) and a fork's do not, so a fork deploying
# this repo as documented is telemetry-off and uncapped. Keyed on the repository
# ID of livedesign-app/livedesign.app rather than its name, so a rename or a
# transfer keeps the profile and no fork can match it. In a reusable workflow
# the `github` context is the caller's, so both callers resolve it the same way.
env:
  HOSTED: ${{ github.repository_id == '1253158818' }}

# Least privilege: deploys authenticate to Cloudflare with CF_API_TOKEN, which
# is a secret rather than a token permission, so no job here needs write access
# to the repository itself.
permissions:
  contents: read

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The live build id (docs/specs/016-platform/stale-builds.md): the commit this run builds, baked
    # into the editor and handed to the api deploy, so both name the same build.
    outputs:
      build_id: ${{ steps.build-id.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history, without file contents: the help sitemap dates each article by its last
          # commit (apps/help/lib/article-dates.ts). Commits and trees only, about 8 MB and 2 s;
          # a shallow clone would date every article to this one commit, so the sitemap omits
          # dates when it finds one.
          fetch-depth: 0
          filter: blob:none

      - name: Record the build id
        id: build-id
        run: echo "id=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hosted profile's build-time half: NEXT_PUBLIC_TELEMETRY_ENABLED,
      # mirrored from hosted-vars.json so the frontends emit exactly when the api
      # ingests. On in staging too, against staging's own telemetry service — that is how you
      # verify a new event lands before production sees it. Skipped on a fork,
      # whose frontends then emit nothing unless its own build env opts in.
      - name: Apply hosted profile to the build
        if: env.HOSTED == 'true'
        working-directory: apps/api
        env:
          WRANGLER_ENV: ${{ inputs.wrangler_env }}
        run: |
          set -euo pipefail
          node scripts/hosted-vars.mjs build-env ${WRANGLER_ENV:+--env "$WRANGLER_ENV"} >> "$GITHUB_ENV"

      - name: Build all apps
        # Whether the live app shows sign-in is baked into `next build`
        # at this step (apps/live/lib/auth-config.ts): on exactly when the
        # api below is given an accounts client, so the two always agree.
        # Unset, the live app runs in guest-only mode.
        env:
          NEXT_PUBLIC_SIGN_IN_ENABLED: ${{ secrets.ACCOUNTS_CLIENT_ID != '' && 'true' || '' }}
          # Which MCP host the live app points at. Empty in production (the
          # app's own default is the hosted one); staging passes
          # mcp-staging.livedesign.app so a staging OAuth flow stays inside
          # staging (docs/specs/016-platform/staging-environment.md).
          NEXT_PUBLIC_MCP_ORIGIN: ${{ inputs.mcp_origin }}
          # The live build id, matched by the api's BUILD_ID (docs/specs/016-platform/stale-builds.md).
          NEXT_PUBLIC_BUILD_ID: ${{ steps.build-id.outputs.id }}
        run: pnpm build

      - name: Upload marketing build
        uses: actions/upload-artifact@v7
        with:
          name: marketing-out
          path: apps/marketing/out
          retention-days: 1

      - name: Upload live build
        uses: actions/upload-artifact@v7
        with:
          name: live-out
          path: apps/live/out
          retention-days: 1

      - name: Upload help build
        uses: actions/upload-artifact@v7
        with:
          name: help-out
          path: apps/help/out
          retention-days: 1

  deploy-marketing:
    name: Deploy marketing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `${WRANGLER_ENV:+--env "$WRANGLER_ENV"}` below expands to nothing when
      # this is empty, so production runs the exact command it always ran.
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: marketing-out
          path: apps/marketing/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-help:
    name: Deploy help
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: help-out
          path: apps/help/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/help
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-live:
    name: Deploy live
    # After the api, so a new editor never calls an api that lacks its routes
    # (docs/specs/016-platform/deployment.md, "Old and new workers side by side").
    needs: [build, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: live-out
          path: apps/live/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-api:
    name: Deploy api
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context can't be read inside a step `if:`
    # (GitHub only allows env/github/needs/vars there), so lift the
    # sign-in values into job-level env vars. The "Sync" steps below
    # then gate on the env var instead of the secret directly. An
    # empty/unset secret yields an empty env var, which the step treats
    # as "skip" — the pure-guest fallback.
    env:
      ACCOUNTS_URL: ${{ secrets.ACCOUNTS_URL }}
      API_RESOURCE: ${{ secrets.API_RESOURCE }}
      ACCOUNTS_CLIENT_ID: ${{ secrets.ACCOUNTS_CLIENT_ID }}
      ACCOUNTS_CLIENT_SECRET: ${{ secrets.ACCOUNTS_CLIENT_SECRET }}
      MEDIA_KEY: ${{ secrets.MEDIA_KEY }}
      TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `whoami` prints which Cloudflare account the API token sees,
      # so when a deploy fails with a 7403 "account not authorized"
      # the log shows immediately whether (a) the token lacks a
      # scope, or (b) the token belongs to a different account than
      # CF_ACCOUNT_ID. Without this the error is too generic to act on.
      - name: Verify Cloudflare token
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler whoami || true

      # Push the sign-in values as worker secrets so the worker can run
      # the sign-in round trip and verify access tokens
      # (apps/api/wrangler.toml lists them). Repo secrets because they stay
      # out of wrangler.toml. `wrangler secret put` overwrites if the
      # secret already exists, so this step is idempotent — rotating a
      # value is just editing the GitHub secret + re-running deploy. Each
      # empty one is skipped; without ACCOUNTS_URL and API_RESOURCE the api
      # falls through to pure-guest mode (docs/specs/014-identity/auth-and-guest-access.md).
      #
      # Worker secrets are per-environment, so the staging worker's
      # copies never collide with production's.
      - name: Sync sign-in secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in ACCOUNTS_URL API_RESOURCE ACCOUNTS_CLIENT_ID ACCOUNTS_CLIENT_SECRET; do
            value="${!name}"
            [ -n "$value" ] || continue
            printf '%s' "$value" \
              | pnpm exec wrangler secret put "$name" ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
          done

      # TELEMETRY_KEY (docs/specs/017-telemetry/telemetry.md) is livedesign's Worker key for liveworkspace's
      # central telemetry service, and has to hold the SAME value on the api and mcp workers as the
      # service's TELEMETRY_KEY_LIVEDESIGN; a mismatch is silent — the posts are simply not stored.
      # Driving both workers from one GitHub secret is what makes them agree by construction.
      # Unset = both steps skip, which leaves whatever is already on the
      # workers (including a pair set by hand) untouched.
      - name: Sync TELEMETRY_KEY secret
        if: ${{ env.TELEMETRY_KEY != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$TELEMETRY_KEY" \
            | pnpm exec wrangler secret put TELEMETRY_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # MEDIA_KEY (liveworkspace/docs/media.md) is livedesign's secret on the liveworkspace media service, which
      # holds it as MEDIA_KEY_LIVEDESIGN. Unset = the step skips, leaving whatever is already on the worker untouched.
      - name: Sync MEDIA_KEY secret
        if: ${{ env.MEDIA_KEY != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$MEDIA_KEY" \
            | pnpm exec wrangler secret put MEDIA_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The build id the editor of this run was built with (docs/specs/016-platform/stale-builds.md).
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        # On the hosted repository the hosted profile rides along as `--var`
        # flags. Sent on EVERY deploy, because `wrangler deploy` replaces the
        # worker's plain vars with exactly the ones it declares: a value set
        # once in the dashboard is gone on the next deploy.
        run: |
          set -euo pipefail
          hosted_vars=()
          if [ "$HOSTED" = 'true' ]; then
            flags="$(node scripts/hosted-vars.mjs flags ${WRANGLER_ENV:+--env "$WRANGLER_ENV"})"
            mapfile -t hosted_vars <<<"$flags"
          fi
          pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"} "${hosted_vars[@]}" --var "BUILD_ID:$BUILD_ID"

      # Read the hosted vars back off the version now serving traffic and fail
      # the run if any is missing or different. The image caps are the R2
      # quota guard; they were once documented as live while no deploy set
      # them, and nothing noticed. This is the step that notices.
      - name: Verify hosted vars are live
        if: env.HOSTED == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/hosted-vars.mjs verify ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-mcp:
    name: Deploy mcp
    # The MCP worker has a service binding to the api worker (docs/specs/015-api/mcp-server.md), so api
    # must exist first. Not a router dependency — mcp.livedesign.app is its own
    # host, not a path under the main hostname.
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lifted to job level for the same reason as deploy-api's: the `secrets`
    # context isn't readable from a step `if:`.
    env:
      TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The matching half of deploy-api's sync — same GitHub secret, so the two
      # workers can't disagree (docs/specs/017-telemetry/telemetry.md). Skipped when unset, leaving whatever
      # is already on the worker in place.
      - name: Sync TELEMETRY_KEY secret
        if: ${{ env.TELEMETRY_KEY != '' }}
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$TELEMETRY_KEY" \
            | pnpm exec wrangler secret put TELEMETRY_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-router:
    name: Deploy router
    # Router has service bindings to all five path-routed workers, so they
    # must exist before it deploys.
    needs: [deploy-marketing, deploy-live, deploy-api, deploy-help]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The router is what makes the hostname serve the new code, so it is the
    # one job that records the GitHub deployment. Putting it on all eight
    # would file eight deployments per run for one release. No protection
    # rules are implied — an environment with none behaves exactly as before;
    # it just gives the run a "View deployment" link, and somewhere to add an
    # approval gate later without touching this file.
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
