name = "livedesign-api"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Local dev port, off wrangler's 8787 default so a livedesign stack runs beside
# livediagram's and liveplanner's (the router's API_ORIGIN and the docs name the same port).
[dev]
port = 8989

# Plain (non-secret) vars. Everything here is every fork's default too, so
# what only livedesign.app runs with is NOT here: TELEMETRY_ENABLED and the
# image gallery caps live in `hosted-vars.json`, which the deploy workflow adds
# with `wrangler deploy --var` on livedesign.app's own repository only, and
# then verifies on the live worker (docs/specs/016-platform/deployment.md
# "Hosted profile"). A fork is therefore telemetry-off and uncapped until it
# opts in, by declaring the var here. TELEMETRY_ENABLED gates this worker's
# anonymous, first-party product events, sent to liveworkspace's central
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/telemetry.md):
# "true" turns it on; anything else, or absent, keeps it fully off. The
# service's URL is TELEMETRY_URL, also from the hosted profile (per
# environment, mirrored into the frontends as NEXT_PUBLIC_TELEMETRY_URL);
# unset means production's (https://liveworkspace.app/api/telemetry). Locally,
# `TELEMETRY_URL=http://localhost:8790/api/telemetry` in .dev.vars.
[vars]

# The central index (liveworkspace/docs/one-explorer.md): where every design is filed and who may open it. The
# grants this api checks are signed by `${INDEX_ORIGIN}/api/index/jwks`, and the design rooms push their summaries
# there with INDEX_KEY (a secret, below). Local dev: `INDEX_ORIGIN=http://127.0.0.1:8793` in `.dev.vars`.
INDEX_ORIGIN = "https://liveworkspace.app"

# The CLI signs in through the MCP worker's OAuth server (docs/specs/015-api/cli.md "Authentication"); the
# api names it in /api/capabilities. CLI_MIN_VERSION (unset until a release needs a floor) refuses writes
# from an older CLI.
OAUTH_ISSUER = "https://mcp.livedesign.app"

# R2 bucket holding photo pages' pixels: tiles, sources and previews, by content
# (docs/specs/031-photo/photo-store.md "The photo blob store"). Photo blobs are a tab's working data, not
# someone's pictures (those, and every design's previews, are the media service's: MEDIA_KEY below,
# liveworkspace/docs/previews.md). Create with `wrangler r2 bucket create livedesign-photo-blobs`.
# Absent, every photo blob route answers 503 photos_unavailable.
[[r2_buckets]]
binding = "PHOTO_BLOBS"
bucket_name = "livedesign-photo-blobs"

# Per-owner rate limiter (Cloudflare Workers Rate Limiting API).
# Caps writes at 300 / 60s per owner: a generous ceiling for normal
# editing (autosave + comment posts + log appends) but well below
# what a malicious bot would push through. The api worker calls
# `env.WRITE_RATE_LIMITER.limit({ key })` at the top of every write
# endpoint; over-limit requests get a 429. Namespace ids are
# arbitrary local identifiers (Cloudflare scopes by binding name +
# script). When this binding is absent the rate-limit
# helper falls through to "allow" so deployments without the
# feature still work.
[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Per-IP limiter for the CLI's telemetry relay (POST /api/events,
# docs/specs/017-telemetry/telemetry.md "The relay"). Separate namespace from the write limiter so abuse of
# the public relay can never eat into a user's design-write budget. Keyed on
# CF-Connecting-IP in src/routes/events.ts. Absent binding → the helper allows.
[[unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The design's Durable Object (docs/specs/015-api/api.md "Storage"): one SQLite-backed instance per design id,
# holding the design's content (tabs, pages, comments, changesets) in its own SQLite and running its realtime
# room (presence + ordered ops over hibernating WebSockets).
[[durable_objects.bindings]]
name = "DESIGN_ROOM"
class_name = "DesignRoom"

# livedesign has never been deployed, so the classes start SQLite-backed with no rename history.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesignRoom", "WorkbenchStore"]

# Workbench pairings, tickets and sessions moved to liveworkspace's accounts Worker (liveworkspace/docs/workbench.md),
# so this Worker's per-person WorkbenchStore goes, with whatever it held.
[[migrations]]
tag = "v2"
deleted_classes = ["WorkbenchStore"]

# `0 3 * * *`: daily at 03:00 UTC, tell liveworkspace's media service that livedesign's set of image references is
# complete (src/media.ts announceMediaRefs), so a quiet day never holds its sweep up. Each design sends its own
# references from its outbox as they change; the workbench and each design keep themselves tidy on their own alarms.
[triggers]
crons = ["0 3 * * *"]

# Per-IP limiter for share-code resolution (GET /api/share/<code>). That
# read carries the optional share password and is otherwise unauthed +
# exempt from the write limiter, so without this an attacker holding a
# code could brute-force the password unbounded. 30 resolves / 60s per IP
# is ample for legit visitors. Separate namespace. Absent binding → the
# index.ts check is skipped, so the worker still works.
[[unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-IP throttle for GET /api/unfurl (docs/specs/009-elements/link-cards.md): an unauthenticated outbound
# page fetch for link-card previews. 60/60s is plenty for a user dropping
# bookmark cards. Separate namespace. Absent binding → check skipped (when unbound).
[[unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# Per-token read throttle for token-authed GETs (docs/specs/015-api/public-api-and-tokens.md §3.5): an external
# integration's reads, keyed on the token id, so one runaway script can't hammer
# reads independently of the owner's app use. Token WRITES ride
# WRITE_RATE_LIMITER (also keyed on the token id). Absent binding → allow.
[[unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# The image gallery's caps (100 images and 100 MB per person, across every app) are the media service's
# (liveworkspace/docs/media.md "Uploads"), not this worker's.

# RESEND_API_KEY + RESEND_FROM + APP_BASE_URL drive transactional email
# (docs/specs/014-identity/transactional-email.md); the onboarding series is liveworkspace's. All
# optional; an absent RESEND_API_KEY makes the whole email feature inert — no sends, so a deployment
# with email off does zero extra work:
#
#   - RESEND_API_KEY: worker secret. Local dev: drop
#     `RESEND_API_KEY=re_...` into `apps/api/.dev.vars` (gitignored).
#     Production: `wrangler secret put RESEND_API_KEY`.
#   - RESEND_FROM: optional [vars] From identity, e.g.
#     "livedesign <hello@livedesign.app>" (the default). The domain
#     must be verified in Resend.
#   - APP_BASE_URL: optional [vars] public origin for links in emails.
#     Defaults to "https://livedesign.app".

# Sign-in (docs/specs/014-identity/auth-and-guest-access.md) goes through the
# liveworkspace accounts Worker. Four values, provisioned out-of-band so none
# lands in the public repo (docs/specs/002-project-scope/secrets-policy.md):
#
#   ACCOUNTS_URL            the accounts Worker's origin
#                           (https://liveworkspace.app)
#   API_RESOURCE            this API's registered resource, the access
#                           token's audience (https://livedesign.app/api)
#   ACCOUNTS_CLIENT_ID      this app's OAuth client id
#   ACCOUNTS_CLIENT_SECRET  its client secret (the only real secret)
#
#   - Local dev: put them in `apps/api/.dev.vars` (gitignored), plus
#     AUTH_ORIGIN=http://localhost:3400 so the callback comes back
#     through the router. Wrangler reads it on the next `wrangler dev`.
#   - Production: Cloudflare Worker secrets. The deploy workflow pulls
#     each from the GitHub repo secret of the same name and pipes it into
#     `wrangler secret put` on every deploy, so a value rotates by
#     editing the GitHub secret. Secrets persist across deploys
#     independently of this file.
#
# ACCOUNTS_URL, ACCOUNTS_CLIENT_ID, ACCOUNTS_CLIENT_SECRET and API_RESOURCE name livedesign's client at the
# liveworkspace accounts Worker (liveworkspace/docs/integrating-an-app.md): every caller, a guest included, is a
# token it minted (docs/specs/014-identity/auth-and-guest-access.md). Unset, nobody is signed in or a guest, and
# only share links open designs.
#
# INDEX_KEY is livedesign's key at the central index (liveworkspace/docs/one-explorer-contracts.md "Reaching the index"):
# what the design rooms push their summaries with, what the api asks for an API token's grants with, and what the
# index calls this api's internal doors with. Secret material: `INDEX_KEY=dev-livedesign-index-key` in
# `.dev.vars` locally, `wrangler secret put INDEX_KEY` in production, the same value as the index's key for
# livedesign. Unset, no design opens.

# TELEMETRY_KEY is livedesign's Worker key for liveworkspace's central
# telemetry service (docs/specs/017-telemetry/telemetry.md, liveworkspace/docs/telemetry.md), sent as
# X-Telemetry-Key: a Worker sends no Origin, so the key is what lets its posts
# speak for livedesign.app. Secret material, provisioned out-of-band like the
# two above; never in [vars]:
#
#   - Local dev: `TELEMETRY_KEY=dev-livedesign-key` in `apps/api/.dev.vars`
#     (gitignored), matching the service's .dev.vars.
#   - Production: `wrangler secret put TELEMETRY_KEY` here and on the mcp
#     worker, the SAME value as the service's TELEMETRY_KEY_LIVEDESIGN.
#     Generate with `openssl rand -hex 32`.
#
# Unset = this worker sends no telemetry, so a self-host can ignore it.

# MEDIA_KEY is livedesign's secret on liveworkspace's media service (liveworkspace/docs/media.md,
# src/media.ts), which keeps every app's uploaded images. The service holds the same value as
# MEDIA_KEY_LIVEDESIGN. Never in [vars]:
#
#   - Local dev: `MEDIA_KEY=dev-livedesign-media-key` and
#     `MEDIA_URL=http://localhost:8792/api/media` in `apps/api/.dev.vars`.
#   - Production and staging: the MEDIA_KEY / MEDIA_KEY_STAGING GitHub secrets, synced by the
#     deploy workflow. MEDIA_URL comes from hosted-vars.json.
#
# Unset = no images: the image endpoints answer 503 and the editor hides the Image entry.


# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `livedesign-api-staging` via
# `wrangler deploy --env staging`.
#
# Everything below is restated ON PURPOSE. Wrangler does NOT inherit
# bindings into a named environment: `vars`, `r2_buckets`,
# `durable_objects`, `migrations` and `unsafe` are all non-inheritable, so a
# block omitted here is a binding MISSING from the deployed staging worker,
# with no warning. Only `main`, `compatibility_date`, `rules` and `triggers`
# carry over from the production config above.
#
# The values that genuinely differ from production are the R2 buckets, the
# index origin, and the email vars that name the public origin. Everything
# else agreeing with production is the point: staging is a rehearsal.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livedesign-api-staging"

# TELEMETRY_ENABLED and the image caps come from `hosted-vars.json`, exactly as
# for production (see the top of this file), and so does TELEMETRY_URL: staging's
# events go to staging's telemetry service, never into production's published numbers.
[env.staging.vars]
# APP_BASE_URL comes from `hosted-vars.json` per environment, so staging's email and workbench links point
# back at staging (docs/specs/014-identity/transactional-email.md, docs/specs/013-workspace/workbench-embeds.md).
RESEND_FROM = "livedesign staging <hello@livedesign.app>"

# Staging's own index (see the top-level [vars]).
INDEX_ORIGIN = "https://staging.liveworkspace.app"

# The staging MCP worker's OAuth server, for the CLI against staging.
OAUTH_ISSUER = "https://mcp-staging.livedesign.app"

# Own bucket: `wrangler r2 bucket create livedesign-photo-blobs-staging`. Sharing production's would let staging
# overwrite or delete real photo blobs.
[[env.staging.r2_buckets]]
binding = "PHOTO_BLOBS"
bucket_name = "livedesign-photo-blobs-staging"

# Rate limiters. Namespace ids deliberately MATCH production's: Cloudflare
# scopes a namespace per script, and `livedesign-api-staging` is a different
# script, so these are already separate counters. Renumbering them would
# imply the number carries meaning across workers, which it doesn't.
[[env.staging.unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[env.staging.unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# A different script is a different Durable Object namespace, so staging's
# DESIGN_ROOM instances are separate from production's for free. The class
# still needs its own migration tag in this environment.
[[env.staging.durable_objects.bindings]]
name = "DESIGN_ROOM"
class_name = "DesignRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DesignRoom", "WorkbenchStore"]

[[env.staging.migrations]]
tag = "v2"
deleted_classes = ["WorkbenchStore"]

# The four ACCOUNTS_* / API_RESOURCE values, INDEX_KEY and
# TELEMETRY_KEY come from the
# `_STAGING` GitHub secrets via the deploy workflow. RESEND_API_KEY is provisioned by
# hand exactly as it is for production:
#   cd apps/api && wrangler secret put RESEND_API_KEY --env staging
# Worker secrets are per-environment, so staging's never collide with
# production's.

# The daily announce runs on staging too, against staging's media service. Restated rather than inherited so
# that reading this block tells you what the staging worker actually does.
[env.staging.triggers]
crons = ["0 3 * * *"]
