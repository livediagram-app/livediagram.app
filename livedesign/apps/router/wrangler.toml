name = "livedesign-router"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Service bindings to the marketing and live apps.
# The `service` values must match the deployed Worker names of each downstream app.
# Production wiring is TBD — these placeholders will be revisited when the apps
# are first deployed. See docs/specs/016-platform/router-app.md.

[[services]]
binding = "MARKETING"
service = "livedesign-marketing"

[[services]]
binding = "LIVE"
service = "livedesign-live"

[[services]]
binding = "API"
service = "livedesign-api"

[[services]]
binding = "TELEMETRY"
service = "livedesign-telemetry"

[[services]]
binding = "HELP"
service = "livedesign-help"

# Local dev (`wrangler dev --env local --port 3400`, the workspace `dev`
# script): service bindings can't reach the local Next dev servers, so this
# environment defines none and sets plain HTTP origins instead. The worker
# falls back to proxying these when a binding is absent. See docs/specs/016-platform/router-app.md.
[env.local.vars]
# Tells the router it fronts `next dev`, whose chunks are not content-hashed, so their own
# no-cache header passes through (docs/specs/016-platform/stale-builds.md "Caching rules").
DEPLOY_ENV = "local"
MARKETING_ORIGIN = "http://127.0.0.1:3401"
LIVE_ORIGIN = "http://127.0.0.1:3402"
API_ORIGIN = "http://127.0.0.1:8989"
TELEMETRY_ORIGIN = "http://127.0.0.1:3403"
HELP_ORIGIN = "http://127.0.0.1:3404"

# ---------------------------------------------------------------------------
# Staging (docs/specs/016-platform/staging-environment.md). Deploys as `livedesign-router-staging` and fronts
# https://staging.livedesign.app (the custom domain is attached in the
# Cloudflare dashboard — the deploy token has no zone scope, same as
# production).
#
# EVERY `service` below carries the `-staging` suffix. Service bindings are
# non-inheritable, so these six are the staging router's only downstreams,
# but a suffix dropped from one of them is the worst failure this repo can
# produce: a staging frontend writing to the PRODUCTION database, with
# nothing in the UI to say so. Read them against the six above before
# changing anything here; `pnpm staging:check` prints the resolved binding table.
# ---------------------------------------------------------------------------

# Named explicitly: wrangler would append "-staging" to the top-level
# name on its own, but nothing in `--dry-run` prints the name it resolved,
# and the router's service bindings depend on this exact string.
[env.staging]
name = "livedesign-router-staging"

[[env.staging.services]]
binding = "MARKETING"
service = "livedesign-marketing-staging"

[[env.staging.services]]
binding = "LIVE"
service = "livedesign-live-staging"

[[env.staging.services]]
binding = "API"
service = "livedesign-api-staging"

[[env.staging.services]]
binding = "TELEMETRY"
service = "livedesign-telemetry-staging"

[[env.staging.services]]
binding = "HELP"
service = "livedesign-help-staging"

# Marks this router as the staging one. The worker reads it to stamp
# `X-Robots-Tag: noindex, nofollow` on every response, which is what keeps a
# public staging mirror out of search results (docs/specs/016-platform/staging-environment.md). Set ONLY here —
# production's router has no DEPLOY_ENV, so the header is impossible there.
[env.staging.vars]
DEPLOY_ENV = "staging"
